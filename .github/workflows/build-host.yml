name: Release — build hosts & publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
            npm_pkg: host-win32-x64
            bin_ext: .exe
            full_bin: target/release/tynd-full.exe
            lite_bin: target/release/tynd-lite.exe

          - runner: windows-11-arm
            target: windows-arm64
            npm_pkg: host-win32-arm64
            bin_ext: .exe
            full_bin: target/release/tynd-full.exe
            lite_bin: target/release/tynd-lite.exe

          - runner: ubuntu-latest
            target: linux-x64
            npm_pkg: host-linux-x64
            bin_ext: ""
            full_bin: target/release/tynd-full
            lite_bin: target/release/tynd-lite

          - runner: ubuntu-24.04-arm
            target: linux-arm64
            npm_pkg: host-linux-arm64
            bin_ext: ""
            full_bin: target/release/tynd-full
            lite_bin: target/release/tynd-lite

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Linux system deps (cached)
        if: startsWith(matrix.runner, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libxdo-dev libxss-dev
          version: 1.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tynd-rust-release
          key: ${{ matrix.target }}

      - name: cargo clippy (release)
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Build tynd-full
        run: cargo build --release -p tynd-full

      - name: Build tynd-lite
        run: cargo build --release -p tynd-lite

      - name: Stage binaries into platform sub-package
        shell: bash
        run: |
          mkdir -p "packages/${{ matrix.npm_pkg }}/bin"
          cp "${{ matrix.full_bin }}" "packages/${{ matrix.npm_pkg }}/bin/tynd-full${{ matrix.bin_ext }}"
          cp "${{ matrix.lite_bin }}" "packages/${{ matrix.npm_pkg }}/bin/tynd-lite${{ matrix.bin_ext }}"
          cp LICENSE "packages/${{ matrix.npm_pkg }}/LICENSE" || true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/${{ matrix.npm_pkg }}/bin/tynd-full${{ matrix.bin_ext }}
            packages/${{ matrix.npm_pkg }}/bin/tynd-lite${{ matrix.bin_ext }}

      - name: Upload sub-package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.npm_pkg }}
          path: packages/${{ matrix.npm_pkg }}/
          if-no-files-found: error

  build-macos:
    name: Build macOS (x64 + arm64)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Add macOS cross targets to pinned toolchain
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tynd-rust-release
          key: macos-universal

      - name: cargo clippy (release, host)
        run: cargo clippy --release --workspace --all-targets -- -D warnings

      - name: Build tynd-full (x86_64-apple-darwin)
        run: cargo build --release --target x86_64-apple-darwin -p tynd-full

      - name: Build tynd-lite (x86_64-apple-darwin)
        run: cargo build --release --target x86_64-apple-darwin -p tynd-lite

      - name: Build tynd-full (aarch64-apple-darwin)
        run: cargo build --release --target aarch64-apple-darwin -p tynd-full

      - name: Build tynd-lite (aarch64-apple-darwin)
        run: cargo build --release --target aarch64-apple-darwin -p tynd-lite

      - name: Stage binaries into platform sub-packages
        shell: bash
        run: |
          mkdir -p packages/host-darwin-x64/bin packages/host-darwin-arm64/bin
          cp target/x86_64-apple-darwin/release/tynd-full packages/host-darwin-x64/bin/tynd-full
          cp target/x86_64-apple-darwin/release/tynd-lite packages/host-darwin-x64/bin/tynd-lite
          cp target/aarch64-apple-darwin/release/tynd-full packages/host-darwin-arm64/bin/tynd-full
          cp target/aarch64-apple-darwin/release/tynd-lite packages/host-darwin-arm64/bin/tynd-lite
          cp LICENSE packages/host-darwin-x64/LICENSE
          cp LICENSE packages/host-darwin-arm64/LICENSE

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            packages/host-darwin-x64/bin/tynd-full
            packages/host-darwin-x64/bin/tynd-lite
            packages/host-darwin-arm64/bin/tynd-full
            packages/host-darwin-arm64/bin/tynd-lite

      - name: Upload sub-package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: host-darwin
          path: |
            packages/host-darwin-x64/
            packages/host-darwin-arm64/
          if-no-files-found: error

  publish:
    name: Publish npm packages (platform sub-packages + wrapper + core + host-src)
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: Cache workspace node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Download built sub-packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Restore staged sub-packages into workspace
        shell: bash
        run: |
          # Each `build` matrix job uploads its `packages/host-<plat>-<arch>/`
          # tree under an artifact named `host-<plat>-<arch>`. macOS uploads
          # both x64 and arm64 under a single `host-darwin` artifact.
          for art in artifacts/host-*; do
            name=$(basename "$art")
            if [ "$name" = "host-darwin" ]; then
              cp -R "$art/host-darwin-x64" packages/
              cp -R "$art/host-darwin-arm64" packages/
            else
              cp -R "$art" "packages/$name"
            fi
          done
          # Sanity: every sub-package now has populated bin/
          for d in packages/host-*-*/bin; do
            ls -la "$d"
          done

      - name: Define publish_with_retry
        run: |
          cat > "$RUNNER_TEMP/publish.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          attempt=1
          max_attempts=3
          delay=5
          until npm publish --access public --provenance; do
            if (( attempt >= max_attempts )); then
              echo "npm publish: exhausted $max_attempts attempts"
              exit 1
            fi
            echo "npm publish failed (attempt $attempt/$max_attempts), retrying in ${delay}s…"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          EOF
          chmod +x "$RUNNER_TEMP/publish.sh"

      # Publish platform sub-packages BEFORE the wrapper. esbuild's pattern:
      # the wrapper resolves them as optionalDependencies, so they must
      # exist on the registry first or `bun add @tynd/host` will skip them.
      - name: Publish @tynd/host-darwin-x64
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/host-darwin-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/host-darwin-arm64
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/host-darwin-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/host-linux-x64
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/host-linux-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/host-linux-arm64
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/host-linux-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/host-win32-x64
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/host-win32-x64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/host-win32-arm64
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/host-win32-arm64
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/core
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/host (wrapper, after sub-packages)
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/host
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/host-src
        run: "$RUNNER_TEMP/publish.sh"
        working-directory: packages/host-src
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
