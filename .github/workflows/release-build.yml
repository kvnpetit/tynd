name: Build release tooling

on:
  workflow_call:
    inputs:
      verify_reproducibility:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-tooling:
    name: Build native tooling (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            npm_pkg: tooling-linux-x64
            bin_ext: ""
            bundler_artifact: tynd-bundler
            bundler_asset: tynd-bundler-x86_64-unknown-linux-gnu.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            npm_pkg: tooling-linux-arm64
            bin_ext: ""
            bundler_artifact: tynd-bundler
            bundler_asset: tynd-bundler-aarch64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            npm_pkg: tooling-darwin-x64
            bin_ext: ""
            bundler_artifact: tynd-bundler
            bundler_asset: tynd-bundler-x86_64-apple-darwin.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            npm_pkg: tooling-darwin-arm64
            bin_ext: ""
            bundler_artifact: tynd-bundler
            bundler_asset: tynd-bundler-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm_pkg: tooling-win32-x64
            bin_ext: .exe
            bundler_artifact: tynd-bundler.exe
            bundler_asset: tynd-bundler-x86_64-pc-windows-msvc.zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            npm_pkg: tooling-win32-arm64
            bin_ext: .exe
            bundler_artifact: tynd-bundler.exe
            bundler_asset: tynd-bundler-aarch64-pc-windows-msvc.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          targets: ${{ matrix.target }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
          no-cache: true

      - name: Activate MSVC ARM64 cross-compile env
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) {
            throw 'Visual Studio with the MSVC ARM64 build tools was not found.'
          }

          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $devShell = Join-Path $installation 'Common7/Tools/Launch-VsDevShell.ps1'
          & $devShell -Arch arm64 -HostArch amd64 -SkipAutomaticLocation -NoLogo
          if ($env:VSCMD_ARG_TGT_ARCH -ne 'arm64') {
            throw 'The Visual Studio developer shell did not select ARM64.'
          }

          # Carry the developer shell environment over to the Cargo steps.
          Get-ChildItem Env: |
            Where-Object { $_.Value -cne $before[$_.Name] } |
            ForEach-Object { "$($_.Name)=$($_.Value)" } |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

      - name: Build tynd and tynd-mcp
        run: cargo build --locked --release --target ${{ matrix.target }} -p tynd-cli --bins

      - name: Build tynd-bundler
        run: cargo build --locked --release --target ${{ matrix.target }} -p tynd-bundler

      - name: Record native tooling digests before clean rebuild
        if: inputs.verify_reproducibility
        shell: bash
        run: |
          bun scripts/check-reproducible-artifact.ts record \
            "target/${{ matrix.target }}/release/tynd${{ matrix.bin_ext }}" \
            "$RUNNER_TEMP/tynd-digest.json"
          bun scripts/check-reproducible-artifact.ts record \
            "target/${{ matrix.target }}/release/tynd-mcp${{ matrix.bin_ext }}" \
            "$RUNNER_TEMP/tynd-mcp-digest.json"
          bun scripts/check-reproducible-artifact.ts record \
            "target/${{ matrix.target }}/release/${{ matrix.bundler_artifact }}" \
            "$RUNNER_TEMP/bundler-digest.json"

      - name: Clean native tooling outputs
        if: inputs.verify_reproducibility
        run: |
          cargo clean --locked --release --target ${{ matrix.target }} -p tynd-cli
          cargo clean --locked --release --target ${{ matrix.target }} -p tynd-bundler

      - name: Rebuild native tooling
        if: inputs.verify_reproducibility
        run: |
          cargo build --locked --release --target ${{ matrix.target }} -p tynd-cli --bins
          cargo build --locked --release --target ${{ matrix.target }} -p tynd-bundler

      - name: Verify reproducible native tooling
        if: inputs.verify_reproducibility
        shell: bash
        run: |
          bun scripts/check-reproducible-artifact.ts verify \
            "target/${{ matrix.target }}/release/tynd${{ matrix.bin_ext }}" \
            "$RUNNER_TEMP/tynd-digest.json"
          bun scripts/check-reproducible-artifact.ts verify \
            "target/${{ matrix.target }}/release/tynd-mcp${{ matrix.bin_ext }}" \
            "$RUNNER_TEMP/tynd-mcp-digest.json"
          bun scripts/check-reproducible-artifact.ts verify \
            "target/${{ matrix.target }}/release/${{ matrix.bundler_artifact }}" \
            "$RUNNER_TEMP/bundler-digest.json"

      - name: Stage native tooling platform package
        shell: bash
        run: |
          package="npm/${{ matrix.npm_pkg }}"
          mkdir -p "$package/bin"
          cp "target/${{ matrix.target }}/release/tynd${{ matrix.bin_ext }}" \
            "$package/bin/tynd${{ matrix.bin_ext }}"
          cp "target/${{ matrix.target }}/release/tynd-mcp${{ matrix.bin_ext }}" \
            "$package/bin/tynd-mcp${{ matrix.bin_ext }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bundler_artifact }}" \
            "$package/bin/tynd-bundler${{ matrix.bin_ext }}"
          cp LICENSE "$package/LICENSE"

      - name: Attest native tooling provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            npm/${{ matrix.npm_pkg }}/bin/tynd${{ matrix.bin_ext }}
            npm/${{ matrix.npm_pkg }}/bin/tynd-mcp${{ matrix.bin_ext }}
            npm/${{ matrix.npm_pkg }}/bin/tynd-bundler${{ matrix.bin_ext }}

      - name: Upload native tooling platform package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.npm_pkg }}
          path: npm/${{ matrix.npm_pkg }}/
          if-no-files-found: error

      - name: Package bundler release asset
        working-directory: target/${{ matrix.target }}/release
        run: bun "${{ github.workspace }}/scripts/package-release-asset.ts" "${{ matrix.bundler_artifact }}" "${{ matrix.bundler_asset }}"

      - name: SHA-256 bundler sidecar (unix)
        if: runner.os != 'Windows'
        working-directory: target/${{ matrix.target }}/release
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.bundler_asset }}" > "${{ matrix.bundler_asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.bundler_asset }}" > "${{ matrix.bundler_asset }}.sha256"
          fi

      - name: SHA-256 bundler sidecar (windows)
        if: runner.os == 'Windows'
        working-directory: target/${{ matrix.target }}/release
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "${{ matrix.bundler_asset }}").Hash.ToLower()
          "$hash  ${{ matrix.bundler_asset }}" | Out-File -Encoding ascii -NoNewline "${{ matrix.bundler_asset }}.sha256"

      - name: Attest bundler release asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            target/${{ matrix.target }}/release/${{ matrix.bundler_asset }}
            target/${{ matrix.target }}/release/${{ matrix.bundler_asset }}.sha256

      - name: Upload bundler release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundler-evidence-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.bundler_artifact }}
            target/${{ matrix.target }}/release/${{ matrix.bundler_asset }}
            target/${{ matrix.target }}/release/${{ matrix.bundler_asset }}.sha256
          if-no-files-found: error
          retention-days: 30

  release-evidence:
    name: Verify release provenance matrix
    needs: build-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
          no-cache: true

      - name: Download native tooling packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tooling-*
          path: npm/

      - name: Verify staged native tooling packages
        run: |
          chmod +x npm/tooling-darwin-*/bin/* npm/tooling-linux-*/bin/*
          node npm/tooling/scripts/check-platform-packages.js

      - name: Download bundler evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundler-evidence-*
          path: .tynd/release-evidence/bundlers

      - name: Verify GitHub build attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/.tynd/release-evidence"
          subjects_tsv="$root/attested-subjects.tsv"
          : > "$subjects_tsv"
          mapfile -t subjects < <(
            find "$root/bundlers" -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print
          )
          if [ "${#subjects[@]}" -ne 12 ]; then
            echo "::error::Expected 12 attested release subjects, found ${#subjects[@]}"
            exit 1
          fi
          for subject in "${subjects[@]}"; do
            gh attestation verify "$subject" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --source-digest "$GITHUB_SHA"
            relative="${subject#"$root/"}"
            digest="$(sha256sum "$subject" | cut -d ' ' -f 1)"
            printf '%s\t%s\n' "$relative" "$digest" >> "$subjects_tsv"
          done
          jq -Rn \
            --arg commit "$GITHUB_SHA" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              schemaVersion: 1,
              commit: $commit,
              generatedAt: $generated_at,
              subjects: [
                inputs |
                split("\t") |
                {path: .[0], sha256: .[1]}
              ]
            }' < "$subjects_tsv" > "$root/attestations.json"

      - name: Validate binary contents, checksums and provenance
        run: |
          bun scripts/check-release-provenance-evidence.ts \
            --root .tynd/release-evidence \
            --attestations .tynd/release-evidence/attestations.json \
            --commit "$GITHUB_SHA" \
            --output .tynd/release-provenance-matrix.json

      - name: Upload verified release provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance-matrix
          path: .tynd/release-provenance-matrix.json
          if-no-files-found: error
          retention-days: 90
