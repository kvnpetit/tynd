# Per-PR criterion regression check.
#
# How it works:
#   1. Build + run the criterion benches under `packages/host-rs/benches/`
#      with `--save-baseline=pr` against the PR HEAD (current checkout).
#   2. Switch the working tree to the PR's merge base on `main` and re-run
#      the same benches with `--save-baseline=main`.
#   3. Compare the two saved baselines with `critcmp` and post the diff
#      to the job summary.
#   4. Fail the job if any bench regresses by more than 5 %.
#
# Skipped on `push` to `main` (no baseline to compare against). Use
# `workflow_dispatch` to do an ad-hoc run with the most recent main as
# baseline (useful before a release).
#
# Notes:
#   - We pin to `ubuntu-latest` only. The same hardware on both runs is
#     the only way the comparison stays meaningful — cross-OS / cross-arch
#     comparisons are noise.
#   - `--sample-size 10 --measurement-time 2 --warm-up-time 1` are the
#     same flags the bench docstrings record their baselines with.
#     Anything tighter takes too long; anything looser misses regressions.
#   - `concurrency: cancel-in-progress` so PRs that push twice in a row
#     don't double-spend a 30-minute job.

name: Bench Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Criterion regression check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the merge-base commit so we can `git checkout` it for the
          # baseline run.
          fetch-depth: 0

      - name: Install Linux system deps (cached)
        # host-rs links GTK/WebKit2GTK at build time even for benches because
        # `wry` is in the always-on dep set — same packages the main CI job
        # installs.
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libxdo-dev libxss-dev
          version: 1.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tynd-rust-bench

      - name: Install critcmp
        # `critcmp` reads the criterion baseline JSON dumps and prints a
        # human-readable diff. `--locked` keeps the binary reproducible
        # across runs.
        run: cargo install critcmp --locked

      # ---- 1. Bench the PR HEAD ----------------------------------------------
      - name: Bench (PR HEAD)
        working-directory: tynd
        run: |
          set -euo pipefail
          for bench in ipc_eval_str ipc_yield_batch ipc_rkyv_vs_serde scheme_bin plugin_dispatch fs_acl; do
            echo "::group::bench $bench (pr)"
            cargo bench -p tynd-host --bench "$bench" -- \
              --sample-size 10 --measurement-time 2 --warm-up-time 1 \
              --save-baseline pr
            echo "::endgroup::"
          done

      # ---- 2. Switch to merge-base and re-bench ------------------------------
      - name: Resolve merge base with main
        id: merge_base
        working-directory: tynd
        run: |
          # Pull main without checking it out, then resolve the common
          # ancestor with the PR HEAD. That's the right comparison point —
          # not `origin/main` HEAD, which may have moved since the PR
          # branched.
          git fetch origin main:refs/remotes/origin/main
          base=$(git merge-base HEAD origin/main)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing PR HEAD against $base"

      - name: Stash workspace state then checkout base
        working-directory: tynd
        run: |
          # The criterion baseline JSON lives under target/criterion/, which
          # cargo treats as build output and ignores via .gitignore — so a
          # `git checkout` won't disturb it. Just stash the source tree.
          git stash push --include-untracked --message "bench-pr-state" || true
          git checkout ${{ steps.merge_base.outputs.base }}

      - name: Bench (merge base)
        working-directory: tynd
        run: |
          set -euo pipefail
          for bench in ipc_eval_str ipc_yield_batch ipc_rkyv_vs_serde scheme_bin plugin_dispatch fs_acl; do
            echo "::group::bench $bench (main)"
            # Some benches may not exist on the merge base yet (e.g. fs_acl
            # was added in this wave). Skip-on-error keeps the comparison
            # job from blowing up on a not-yet-introduced bench — critcmp
            # will simply have nothing to compare for that name.
            cargo bench -p tynd-host --bench "$bench" -- \
              --sample-size 10 --measurement-time 2 --warm-up-time 1 \
              --save-baseline main || echo "bench $bench missing on base — skipped"
            echo "::endgroup::"
          done

      - name: Restore PR workspace
        if: always()
        working-directory: tynd
        run: |
          # Always restore so a failure in the bench doesn't leave the
          # checkout in a half-detached state for downstream steps.
          git checkout - || true
          git stash pop || true

      # ---- 3. Compare + report -----------------------------------------------
      - name: Generate critcmp diff
        working-directory: tynd
        run: |
          set -euo pipefail
          # `critcmp main pr` dumps a markdown-friendly table. The
          # `target/criterion/` baselines are read from the cwd by default.
          critcmp main pr > bench-report.txt || {
            echo "critcmp returned non-zero; see report below"
            cat bench-report.txt 2>/dev/null || true
            true
          }
          {
            echo "## Bench Regression Report"
            echo ""
            echo "Comparing PR HEAD against merge-base \`${{ steps.merge_base.outputs.base }}\`."
            echo ""
            echo '```'
            cat bench-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- 4. Threshold gate -------------------------------------------------
      - name: Fail on > 5 % regression
        working-directory: tynd
        run: |
          set -euo pipefail
          # critcmp prints rows like:
          #   eval_resolve/1KB    1.00     1.48±0.04µs    1.05     1.55±0.05µs    main
          # Negative-direction percentages are improvements; we fail only
          # when the ratio in the "main" → "pr" direction exceeds 1.05.
          # Easier to grep for anything whose first numeric column is >
          # 1.05 (= +5 %). The pattern below catches 1.05x through 9.99x
          # (and any double-digit ratio). Grep finds matches → exit 1.
          if grep -E '^\S+\s+1\.(0[5-9]|[1-9][0-9])' bench-report.txt > /tmp/regressions.txt; then
            echo "::error::Performance regression detected (> 5 %):"
            cat /tmp/regressions.txt
            exit 1
          fi
          if grep -E '^\S+\s+[2-9]\.[0-9]+' bench-report.txt > /tmp/regressions.txt; then
            echo "::error::Severe performance regression detected (> 2x):"
            cat /tmp/regressions.txt
            exit 1
          fi
          echo "No regression > 5 % vs main."
