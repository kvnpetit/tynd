name: SBOM Generation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # to upload SBOM as release asset

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom-rust:
    name: Rust SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (cached)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libxdo-dev libxss-dev
          version: 1.2

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate Rust SBOM
        run: cargo cyclonedx --format json --target-dir target

      - name: Upload SBOM (Rust)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-rust-cyclonedx
          path: "**/*-bom.json"

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*-bom.json"

  sbom-npm:
    name: NPM SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Generate npm SBOM via cyclonedx-npm
        run: bunx @cyclonedx/cyclonedx-npm --output-format json --output-file sbom-npm.json

      - name: Upload SBOM (npm)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-npm-cyclonedx
          path: sbom-npm.json

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: sbom-npm.json
