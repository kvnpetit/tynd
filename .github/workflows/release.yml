name: Release — Tynd framework (native tooling + npm packages)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true
      verify_reproducibility:
        description: "Clean rebuild and compare all native tool binaries"
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: ".bun-version"
          no-cache: true
      - name: Bind checkout to workflow commit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA"
      - name: Match tag to framework and native tooling versions
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tooling_version="$(node -p 'require("./npm/tooling/package.json").version')"
          bun scripts/check-release-version.ts framework "$TAG"
          test "$tooling_version" = "${TAG#v}"
          node npm/tooling/scripts/check-platform-packages.js --metadata-only

      - name: Require successful CI for the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --branch main \
              --status success \
              --limit 1 \
              --json headSha
          )"
          test "$(jq 'length' <<<"$runs")" -eq 1
          test "$(jq -r '.[0].headSha' <<<"$runs")" = "$GITHUB_SHA"

  native-tooling:
    needs: preflight
    uses: ./.github/workflows/release-build.yml
    with:
      verify_reproducibility: ${{ inputs.verify_reproducibility }}
    permissions:
      attestations: write
      contents: read
      id-token: write

  publish:
    name: Publish npm packages (native tooling, core, host-src, plugin-sdk, test, mcp, cli, host-backed plugins)
    needs: native-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Manual approval gate — protects against force-pushed tags / token
    # compromise triggering an unvetted publish of the native tooling.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: ".bun-version"
          no-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build publishable JS packages
        run: |
          bun run --cwd packages/plugin-sdk build
          bun run --cwd packages/cli build

      - name: Download native tooling packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: tooling-*
          path: npm/

      - name: Download verified bundler assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundler-evidence-*
          path: artifacts/

      - name: Restore Unix executable modes and validate native packages
        shell: bash
        run: |
          chmod +x npm/tooling-darwin-*/bin/* npm/tooling-linux-*/bin/*
          node npm/tooling/scripts/check-platform-packages.js

      - name: Dry-run every npm package before publishing anything
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            npm/tooling-darwin-x64
            npm/tooling-darwin-arm64
            npm/tooling-linux-x64
            npm/tooling-linux-arm64
            npm/tooling-win32-x64
            npm/tooling-win32-arm64
            npm/tooling
            packages/core
            packages/host-src
            packages/plugin-sdk
            packages/test
            packages/mcp
            packages/cli
          )
          for plugin in plugins/host/*/; do
            if [ -f "${plugin}package.json" ]; then
              packages+=("${plugin%/}")
            fi
          done
          for pkg in "${packages[@]}"; do
            echo "::group::npm publish --dry-run $pkg"
            tag="$(bun scripts/publish-npm-package.ts --print-tag "$pkg")"
            (cd "$pkg" && npm publish --access public --tag "$tag" --dry-run)
            echo "::endgroup::"
          done

      - name: Recheck the remote tag before publication
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"

      - name: Publish native tooling platform packages
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          packages=(
            npm/tooling-darwin-x64
            npm/tooling-darwin-arm64
            npm/tooling-linux-x64
            npm/tooling-linux-arm64
            npm/tooling-win32-x64
            npm/tooling-win32-arm64
          )
          for pkg in "${packages[@]}"; do
            bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" "$pkg"
          done

      - name: Publish @tynd/tooling
        run: bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" .
        working-directory: npm/tooling
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # @tynd/mcp pins @tynd/tooling to the framework version, so it publishes
      # right after the tooling wrapper it depends on.
      - name: Publish @tynd/mcp
        run: bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" .
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/core
        run: bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" .
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/host-src
        run: bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" .
        working-directory: packages/host-src
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/plugin-sdk
        run: bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" .
        working-directory: packages/plugin-sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @tynd/test
        run: bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" .
        working-directory: packages/test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Host-backed plugins (`tynd add <id>` -> @tynd/plugin-<id>) peer-depend on
      # @tynd/core, so they publish after it. Same version as the framework tag.
      - name: Publish host-backed plugins (plugins/host/*)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for plugin in plugins/host/*/; do
            if [ -f "${plugin}package.json" ]; then
              bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" "${plugin%/}"
            fi
          done

      - name: Publish @tynd/cli
        run: bun "$GITHUB_WORKSPACE/scripts/publish-npm-package.ts" .
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish GitHub release with verified bundler assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            find artifacts/bundler-evidence-* -type f \
              \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) \
              -print |
              sort
          )
          test "${#assets[@]}" -eq 12
          if draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [ "$draft" = true ]; then
              gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag \
              --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
