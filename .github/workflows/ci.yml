name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# PR runs are superseded by newer pushes. Runs on main are never cancelled:
# the release preflight (release.yml) requires a successful CI run on the
# exact release commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# No RUSTFLAGS here: it would replace the per-target linker flags in
# .cargo/config.toml (/Brepro, --build-id=none), so CI would not build what
# local and release builds do. Warnings are denied by `clippy -- -D warnings`.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          components: clippy, rustfmt
      - name: Install Linux GUI build dependencies
        run: bash scripts/install-linux-ci-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-check
          workspaces: |
            . -> target
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check
        run: bun run check
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo clippy (tynd-host, all APIs)
        run: cargo clippy --locked -p tynd-host --features api-all --all-targets -- -D warnings

  # cfg(windows) / cfg(target_os = "macos") code is never compiled on the
  # Ubuntu jobs; lint it here before a release tag does.
  native-platforms:
    name: Rust lint (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-native-${{ matrix.runner }}
          workspaces: |
            . -> target
      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: cargo clippy (tynd-host, all APIs)
        run: cargo clippy --locked -p tynd-host --features api-all --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-ci-deps.sh xvfb xauth libasound2-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-test-${{ matrix.runner }}
          workspaces: |
            . -> target
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test workspace (all host APIs and the native audio backend)
        run: cargo test --locked --workspace --features tynd-host/api-all,tynd-plugin-audio/capture
      - name: Test TypeScript packages
        if: runner.os != 'Linux'
        run: bun run test
      - name: Test plugins
        run: bun run test:plugins
      # Releases require CI on the exact main commit. Keep the slower native
      # pack-and-launch check on that push, after the usual PR tests.
      - name: Build tooling for packaged app test
        if: github.event_name == 'push'
        run: cargo build --locked -p tynd-cli -p tynd-bundler --bins
      - name: Test packaged app on Linux
        if: github.event_name == 'push' && runner.os == 'Linux'
        run: xvfb-run -a bun scripts/smoke-packaged.ts
      - name: Test packaged app on Windows and macOS
        if: github.event_name == 'push' && runner.os != 'Linux'
        run: bun scripts/smoke-packaged.ts

  host-feature-matrix:
    name: Host feature matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - name: Install Linux GUI build dependencies
        run: bash scripts/install-linux-ci-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-matrix
      - name: Check feature matrix
        run: bash scripts/check-host-feature-matrix.sh

  # The flattened host mirror shipped as @tynd/host-src is only generated at
  # publish time; regenerate and compile it here so a broken mirror or a
  # committed Cargo.lock that drifted from the root lock fails the PR instead
  # of the release.
  host-src:
    name: host-src mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.100.0"
      - name: Install Linux GUI build dependencies
        run: bash scripts/install-linux-ci-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-host-src
          workspaces: packages/host-src/native -> target
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.22.1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate the host-src mirror
        run: bun run sync:host-src
      - name: Committed mirror files match the generated output
        run: git diff --exit-code -- packages/host-src
      - name: Lint tables match the root workspace (generated mirror)
        run: bun scripts/check-lint-tables.ts
      - name: cargo check (host-src mirror)
        run: cargo check --locked --manifest-path packages/host-src/native/Cargo.toml --workspace
      # Same policy as the root workspace: the mirror lock is a subset of the
      # root lock, so the root deny.toml is the single ignore list.
      - name: cargo deny check (host-src mirror)
        run: cargo deny --manifest-path packages/host-src/native/Cargo.toml --locked --config deny.toml check
      - name: Generate the plugin-sdk mirror
        run: bun run --cwd packages/plugin-sdk sync
      # The npm tarball ships this mirror; it must build with no workspace above it.
      - name: cargo check (plugin-sdk mirror)
        run: cargo check --manifest-path packages/plugin-sdk/native/Cargo.toml

  # rust-version = 1.95 is a promise to users who compile @tynd/host-src with
  # their own toolchain. RUSTUP_TOOLCHAIN overrides rust-toolchain.toml.
  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: "1.95"
      - name: Install Linux GUI build dependencies
        run: bash scripts/install-linux-ci-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-msrv
          workspaces: |
            . -> target
            packages/host-src/native -> target
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: cargo check (workspace)
        run: cargo check --locked --workspace
      - name: Generate the host-src mirror
        run: bun run sync:host-src
      - name: cargo check (host-src mirror)
        run: cargo check --locked --manifest-path packages/host-src/native/Cargo.toml --workspace

  # docs-deploy.yml builds the site on pushes to main; this catches a broken
  # build or dead link before merge.
  docs:
    name: Docs build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ".bun-version"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build docs
        run: bun run --cwd apps/docs build
      - name: Check links
        run: bun run --cwd apps/docs check:links
