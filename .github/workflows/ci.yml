name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  lint-rust:
    name: Rust (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # plugins workspace + plugin-sdk are referenced via path deps
          # (`../plugin-sdk/native`) — checkout sibling repos so cargo can resolve.
          submodules: false

      - name: Checkout plugin-sdk (sibling path dep)
        uses: actions/checkout@v4
        with:
          repository: tynd-apps/plugin-sdk
          path: ../plugin-sdk
          ref: main
        continue-on-error: true

      - name: Install Linux system deps (cached)
        if: startsWith(matrix.runner, 'ubuntu')
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libxdo-dev libxss-dev
          version: 1.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Nightly rustfmt unlocks `imports_granularity` / `group_imports` /
      # `wrap_comments` / `format_strings` — only fmt runs on nightly,
      # the rest of the build stays on stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tynd-rust

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear

      - name: cargo fmt --check
        if: startsWith(matrix.runner, 'ubuntu')
        run: cargo +nightly fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo shear (unused deps)
        if: startsWith(matrix.runner, 'ubuntu')
        run: cargo shear

      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

  lint-ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun global install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - name: Cache workspace node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
            playground/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (lint + format + organize imports)
        run: bunx biome ci

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: bun test
        run: bun test
