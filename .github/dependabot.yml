version: 2
updates:
  # Rust dependencies (workspace + sub-crates auto-detected)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      tauri-ecosystem:
        patterns:
          - "tauri-*"
          - "wry"
          - "tao"
          - "muda"
          - "tray-icon"
          - "window-vibrancy"
      rust-stdlib:
        patterns:
          - "serde*"
          - "tokio*"
          - "tracing*"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels: ["dependencies", "rust"]

  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      typescript-tooling:
        patterns:
          - "typescript"
          - "@types/*"
          - "@biomejs/*"
      bun-types:
        patterns:
          - "@types/bun"
          - "bun-types"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels: ["dependencies", "javascript"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
