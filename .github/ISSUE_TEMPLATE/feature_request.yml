name: Feature request
description: Suggest an idea or improvement for Tynd
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem you're trying to solve before jumping to a specific solution — it helps us evaluate alternatives.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What's the user-facing problem? What are you unable to do today, or what's painful?
      placeholder: I'd like to do X, but the current API forces me to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen? An API sketch, CLI flag, or behavior change is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you tried or considered?
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: Motivation / use case
      description: Why is this important? How many users does it affect, and how often?
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links to related issues, prior art in other tools, mockups, etc.
    validations:
      required: false
