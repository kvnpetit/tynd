# cargo-deny configuration for the `tynd/` Rust workspace.
#
# Run locally with: cargo deny check
#
# Sections:
#   [advisories] — RustSec advisory DB checks (vulnerabilities + yanked crates)
#   [licenses]   — SPDX allow/deny lists with confidence threshold
#   [bans]       — duplicate-version policy + skip-list for known transitive forks
#   [sources]    — registry / git source allow-list

[graph]
# Check all targets we actually ship for. Linux gtk deps + Windows COM stack +
# macOS frameworks all need to be reachable so we don't miss license violations
# behind a `cfg(target_os = "...")` gate.
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features    = false
no-default-features = false

# ---------------------------------------------------------------------------
# Advisories — https://embarkstudios.github.io/cargo-deny/checks/advisories
# ---------------------------------------------------------------------------
[advisories]
version              = 2
db-path              = "~/.cargo/advisory-db"
db-urls              = ["https://github.com/rustsec/advisory-db"]
yanked               = "deny"
git-fetch-with-cli   = true
# Explicit advisory whitelist — every entry MUST be justified.
# Bumping the underlying crate is always preferred over silencing.
ignore = [
    # RUSTSEC-2026-0104 — rustls-webpki 0.103.12 panic on malformed CRL.
    # We do NOT use CRL parsing; ureq + tungstenite both build with rustls
    # but feed it server certs only, never a CRL. Tracking upstream bump
    # to >= 0.103.13; remove this ignore once `cargo update -p rustls-webpki`
    # picks it up (currently pinned by rustls 0.23.38 transitive resolver).
    "RUSTSEC-2026-0104",
    # RUSTSEC-2020-0168 — `mach` is unmaintained. Pulled in transitively by
    # `user-idle` on macOS only. Not a vulnerability; flagged "unmaintained".
    # Track replacement with `mach2` upstream in user-idle (issue filed).
    "RUSTSEC-2020-0168",
    # RUSTSEC-2024-0370 — `proc-macro-error` unmaintained. Deep transitive
    # via the gtk3-rs ecosystem (gtk/glib/cairo macros). Build-time only;
    # no runtime exposure. Replacement (`proc-macro-error2`) requires the
    # whole gtk3-rs stack to migrate — out of scope for this repo.
    "RUSTSEC-2024-0370",
    # RUSTSEC-2024-0411..0420 — gtk-rs GTK3 bindings (atk, gdk, gdk-pixbuf,
    # gdkx11, gio, glib, gtk, gtk-sys, pango, cairo-rs) are unmaintained
    # because the gtk-rs project moved to GTK4. Tao/wry/muda/tray-icon (our
    # entire Linux UI stack) still depend on the GTK3 bindings — migration
    # is upstream-coordinated work tracked in the wry repo. Whitelisted as
    # "unmaintained" advisories ONLY; any future *vulnerability* advisory
    # on these crates would still trigger CI.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
]

# ---------------------------------------------------------------------------
# Licenses — https://embarkstudios.github.io/cargo-deny/checks/licenses
# ---------------------------------------------------------------------------
[licenses]
version              = 2
confidence-threshold = 0.8

# Permissive licenses that are unambiguously OK to link with Apache-2.0 code.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",            # ICU / unicode-ident — DFSG-free, OSI-approved
    "Unicode-DFS-2016",       # legacy unicode crate spelling
    "Unlicense",
    "CC0-1.0",
    "Zlib",
    # 0BSD — public-domain-equivalent, OSI approved. Triggered by `recvmsg`
    # and `doctest-file` (transitive via interprocess). No copyleft.
    "0BSD",
    # BSL-1.0 — Boost Software License, OSI + FSF approved permissive license.
    # Triggered by `clipboard-win` + `error-code` (transitive via arboard).
    "BSL-1.0",
    # CDLA-Permissive-2.0 — Community Data License Agreement, permissive.
    # Triggered by `webpki-roots` (transitive via ureq + tungstenite).
    # Treated as a permissive-data license; OK for binary distribution.
    "CDLA-Permissive-2.0",
    # MPL-2.0 — file-level copyleft. Allowed: MPL files can be linked into a
    # larger work under any license as long as MPL files themselves stay open.
    # We do not modify any MPL crates. Triggered by: `apple-codesign` (subset
    # of files), `option-ext` (transitive via dirs).
    "MPL-2.0",
    # LGPL-2.1+ — *only* allowed because the LGPL crates we touch are linked
    # dynamically (no static vendoring). Concretely this is `r-efi` and
    # similar BSP-style crates pulled in via tauri-bundler's UEFI path; the
    # `gtk` Linux bindings link against system gtk3 dynamically. If a new
    # LGPL crate appears that we statically link, REMOVE this entry — the
    # project cannot ship it under Apache-2.0.
    "LGPL-2.1-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
]

# v2 schema: anything not in `allow` is implicitly denied. Strong-copyleft
# licenses (GPL-3 / AGPL-3) are NOT in the allow-list — they would force the
# entire binary to GPL, which is incompatible with Apache-2.0 + the
# proprietary apps users ship with `tynd build`.
#
# Crates that ship without a SPDX-readable license expression — we audit and
# accept them by hash. Empty for now; populate as cargo deny surfaces them.
exceptions = []

# ring + a few crypto crates use a custom non-SPDX license blob. Clarify them
# so the SPDX matcher doesn't reject what is in fact ISC + OpenSSL + MIT.
[[licenses.clarify]]
name       = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name       = "webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

# ---------------------------------------------------------------------------
# Bans — https://embarkstudios.github.io/cargo-deny/checks/bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
# Wildcards: kept at "warn" because our own workspace crates use `path = ".."`
# deps for sibling repos (plugin-sdk) which cargo encodes as wildcards. The
# `allow-wildcard-paths` escape hatch only works for crates marked
# `publish = false`; tynd-host / tynd-full / tynd-lite are public, so the
# error path triggers. Registry-side wildcard versions (`= "*"`) are still
# surfaced via warnings reviewers can spot.
wildcards            = "warn"
allow-wildcard-paths = true
highlight            = "all"

# Skip duplicate-version warnings for crates whose ecosystem genuinely ships
# multiple majors at any given time. Each entry needs a justification.
skip = [
    # windows-sys: tao/wry/muda/keyring all pin different majors. Fully
    # transitive, no API in our code touches it directly.
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "windows_x86_64_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_i686_msvc" },
    { name = "windows_i686_gnu" },
    # syn 1.x persists via macro crates that haven't migrated to syn 2.
    { name = "syn" },
    # bitflags 1.x lingers in legacy gtk/glib bindings.
    { name = "bitflags" },
    # hashbrown — std re-exports + ahash ship different majors.
    { name = "hashbrown" },
    # base64 — ureq pins 0.22 while a few transitives still hold 0.21.
    { name = "base64" },
    # rand_core / getrandom / regex-automata — common multi-major drift.
    { name = "rand_core" },
    { name = "getrandom" },
    { name = "regex-automata" },
    { name = "regex-syntax" },
    # apple-codesign brings two of itself in via tauri-bundler vs our direct dep.
    { name = "apple-codesign" },
]

# Crates we never want to pull in (license, security, or maintenance reasons).
# Empty for now — populate with `{ name = "...", reason = "..." }` entries.
deny = []

# ---------------------------------------------------------------------------
# Sources — https://embarkstudios.github.io/cargo-deny/checks/sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
