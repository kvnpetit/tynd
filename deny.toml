# cargo-deny — supply-chain policy.
#
# Run: `cargo deny check` (advisories + bans + licenses + sources).
# CI: .github/workflows/supply-chain.yml runs `cargo deny --locked check` from
# the repo root. This is the only advisory ignore list: cargo-audit (same
# RustSec database) is not run, so there is no second list to keep in sync.

[graph]
all-features = true

[advisories]
db-urls       = ["https://github.com/rustsec/advisory-db"]
yanked        = "deny"
# cargo-deny 0.22 narrowed its default to workspace dependencies.
unmaintained  = "all"
# Surface ignores that no longer match any crate so stale ones get removed.
unused-ignored-advisory = "warn"
# Accepted native-stack advisories with no local direct replacement in this
# workspace today. glib arrives through tao/wry/tray/native Linux surfaces
# (the gtk-rs GTK3 unmaintained advisories were withdrawn upstream 2026-08-14);
# mach arrives through user-idle.
ignore        = [
  "RUSTSEC-2020-0168", # mach: transitive via user-idle / IOKit-sys
  "RUSTSEC-2024-0370", # proc-macro-error: transitive via glib/gtk macros
  "RUSTSEC-2024-0449", # unsafe-libyaml: unmaintained, via serde_yaml in tynd-cli (build-time YAML parsing) and apple-codesign
  "RUSTSEC-2026-0370", # zvariant: unmaintained, transitive via tray/notification/portal stacks
  "RUSTSEC-2026-0371", # zbus_names: unmaintained, transitive (same zbus lineage)
  "RUSTSEC-2026-0372", # zvariant_derive: unmaintained, transitive (same zbus lineage)

  # --- tynd-bundler only (crates/bundler) --------------------------------
  # Everything below arrives through apple-codesign / tauri-bundler, the
  # release-time signing and installer stack. None of these crates is in the
  # dependency graph of the shipped binaries; check before adding a consumer:
  #   cargo tree --workspace --exclude tynd-bundler --all-features --target all -i <crate>
  # cargo-deny cannot scope an ignore to one workspace member, so an ID listed
  # here must be re-examined if that command ever finds the crate.
  #
  # rsa Marvin Attack timing side-channel: no fix available, only exploitable
  # with an attacker co-located during signing. The bundler runs locally
  # during a release.
  "RUSTSEC-2023-0071",
  # rustls-webpki 0.101.7 / rustls 0.21 / h2 0.3: legacy aws-smithy connector
  # pulled by apple-codesign. Remove once upstream ships rustls-webpki >= 0.103.13.
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki <0.103.12 (URI name constraint) — pinned by aws-smithy / apple-codesign transitive" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki <0.103.12 (wildcard name constraint) — same transitive lineage" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki <0.103.13 (CRL parser panic) — same transitive lineage" },
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3 compiled in via aws-sdk-s3 legacy rustls feature; never selected at runtime (BehaviorVersion::latest uses rustls 0.23); aws-sdk-s3 enables the legacy feature by default and Cargo features are additive" },
  { id = "RUSTSEC-2026-0346", reason = "rustls 0.21 — same legacy aws connector lineage, not used at runtime" },
  { id = "RUSTSEC-2026-0349", reason = "rustls 0.21 — same legacy aws connector lineage, not used at runtime" },
  { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.101 — same legacy aws connector lineage, not used at runtime" },
  # zip 2.6.1 (apple-codesign 0.29, latest) and zip 8.6.0 (tauri-bundler
  # 2.10.2, latest) cannot move to the fixed zip >= 9.0.5; the workspace `zip`
  # pin (9.x, used by tynd-cli and tynd-bundler directly) is not affected.
  # Reachability, checked against the crate sources: apple-codesign only writes
  # a zip (ZipWriter, for the notarization upload) and re-reads its own output
  # with zip_structs; tauri-bundler only reads in `extract_zip`
  # (ZipArchive::by_index + enclosed_name, no symlinks), fed by the WiX/NSIS
  # tool archives it downloads from pinned URLs and verifies against pinned
  # SHA-256/SHA-1 digests. Neither crate enables the `aes-crypto` or
  # `legacy-zip` features. No untrusted zip reaches either reader. Drop these
  # once upstream moves to zip >= 9.0.5.
  { id = "RUSTSEC-2026-0367", reason = "zip 2.6.1 (apple-codesign, write-only) / 8.6.0 (tauri-bundler, extracts only SHA-pinned WiX/NSIS archives) — extract path not attacker-reachable" },
  { id = "RUSTSEC-2026-0368", reason = "zip extract symlink escape — see RUSTSEC-2026-0367" },
  { id = "RUSTSEC-2026-0369", reason = "zip extract permissions through symlinks — see RUSTSEC-2026-0367" },
  { id = "RUSTSEC-2026-0429", reason = "zip extract abort on large symlink entry — see RUSTSEC-2026-0367" },
  { id = "RUSTSEC-2026-0545", reason = "zip AES entries returned without HMAC check: `aes-crypto` feature not enabled on zip 2.6.1/8.6.0, code not compiled; only SHA-pinned archives are read" },
  { id = "RUSTSEC-2026-0546", reason = "zip ZipArchive::extract symlink escape: never called; tauri-bundler extract_zip writes regular files via enclosed_name from SHA-pinned WiX/NSIS archives" },
  { id = "RUSTSEC-2026-0547", reason = "zip Shrink/Reduce/Implode preallocation: `legacy-zip` feature not enabled on zip 8.6.0, decoders not compiled" },
  { id = "RUSTSEC-2026-0548", reason = "zip ZipStreamReader local-header names: ZipStreamReader is not used by apple-codesign (write-only) or tauri-bundler (ZipArchive on SHA-pinned archives)" },
  { id = "RUSTSEC-2026-0344", reason = "ruzstd 0.7.3 via object 0.36 (apple-codesign); compressed sections are never decompressed" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 via RustCrypto 0.13 crates in apple-codesign/aws-sigv4; local signing, no network oracle; upstream-pinned" },
  # Unmaintained, informational: no safe upgrade exists at the latest
  # apple-codesign / tauri-bundler releases.
  { id = "RUSTSEC-2020-0095", reason = "difference is only transitively pulled by apple-codesign; no safe upstream upgrade exists" },
  { id = "RUSTSEC-2024-0436", reason = "paste is pulled through image/ravif in the bundler graph; no direct runtime use" },
  { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is transitively pulled by the apple-codesign HTTP stack; no safe upstream upgrade path yet" },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained, transitive via aws-smithy-http (apple-codesign); no upstream replacement yet" },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, transitive via apple-codesign and tauri-bundler (rpm, x509-certificate); no safe upgrade exists" },
]

[licenses]
unused-allowed-license = "allow"
# Apache-2.0 / MIT / BSD-3 / ISC / Unicode-DFS-2016 dual-OK across the stack.
# MPL-2.0 file-level copyleft is OK for indirect deps but flagged so we know.
# AGPL / GPL / SSPL / BSL block — license incompatible with shipping.
allow                  = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "NCSA",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
  "CDLA-Permissive-2.0",
]
confidence-threshold   = 0.93
exceptions = [
  # tynd-bundler only: CBOR codec pulled by apple-codesign. BlueOak-1.0.0 is a
  # permissive OSI-approved license; scoped to these crates, not allowed globally.
  { name = "minicbor", allow = [ "BlueOak-1.0.0" ] },
  { name = "minicbor-derive", allow = [ "BlueOak-1.0.0" ] },
]

[bans]
# Duplicate versions are common across the desktop/native stack. Keep bans
# focused on explicitly disallowed crates and wildcard requirements.
multiple-versions = "allow"
wildcards         = "deny"
deny = [
  # Prefer rustls everywhere — avoids OpenSSL ABI fights on Windows.
  { name = "openssl-sys", reason = "use rustls instead" },
  { name = "openssl",     reason = "use rustls instead" },
  # Sled has corruption history; tynd uses redb/fjall instead.
  { name = "sled",        reason = "use redb / fjall" },
  # async-std deprecated March 2025.
  { name = "async-std",   reason = "deprecated; use smol or tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
