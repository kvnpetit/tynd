[package]
name         = "tynd-plugin-wgpu"
description  = "Native wgpu surface (tao window + wgpu Instance) for the Tynd framework. Bypasses the webview renderer to give CAD / game / scientific viz apps direct access to Metal / Vulkan / D3D12."
publish.workspace       = true
version                 = "1.0.0"
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
doctest    = false

[[bin]]
name = "tynd-plugin-wgpu-gen-types"
path = "src/bin/gen-types.rs"

[dependencies]
tynd-plugin-sdk    = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
specta             = { workspace = true }
anyhow             = { version = "1", optional = true }
bon                = { workspace = true }

# === Native renderer stack (opt-in) =========================================
#
# The full wgpu + tao stack adds ~5–10 MB to the binary, takes 5–10 minutes
# to compile from cold caches and pulls in OS-specific framework deps
# (Metal.framework, libvulkan-loader, d3d12). It is gated behind the
# `native` Cargo feature so the default build stays portable on CI runners
# that have no GPU + so apps that link the plugin without using it (e.g. for
# a future capability check) don't pay the build cost.
#
# Without `native`, the plugin compiles + registers normally and every
# method that needs a real surface returns the canonical
# `"wgpu: rebuild with --features native"` error. `available()` reports
# `{ available: false, reason: "native feature not enabled at compile time" }`
# so the frontend can fall back to a webview canvas / WebGPU path.
#
# Build prerequisites when `native` *is* enabled:
# - macOS   : nothing (Metal ships with Xcode CLT).
# - Windows : Windows 10 SDK (D3D12 headers).
# - Linux   : `libvulkan-dev` + `libwayland-dev` / `libxkbcommon-dev`
#             (for tao's wayland + x11 backends).
# `wgpu = "22"` enables the platform-default backends through its
# `default` feature (DX12 + Metal + Vulkan + GL), so we *do* turn defaults
# on here — disabling them would have to be paired with hand-picked
# backend features and the per-OS conditional cfg gating that wgpu does
# upstream. The opt-in cost of `default-features = true` is tracked by the
# top-level `native` Cargo feature, not by trimming wgpu sub-features.
wgpu = { version = "30", optional = true, features = ["wgsl"] }
tao               = { version = "0.37", optional = true }
raw-window-handle = { version = "0.6", optional = true }
pollster          = { version = "1.0", optional = true }
crossbeam-channel = { version = "0.5", optional = true }

[features]
default = []

# Pull in the full native renderer stack. See the long comment above for
# what this turns on, what it costs and what system deps it requires.
native = [
    "dep:anyhow",
    "dep:wgpu",
    "dep:tao",
    "dep:raw-window-handle",
    "dep:pollster",
    "dep:crossbeam-channel",
]

# Emit `wgpu:frame` on every render tick (~60 Hz). Off by default: each
# emit is a JSON serialization + IPC hop, so leaving it on costs noticeable
# CPU on hot paths. Enable when wiring an external frame profiler.
debug-frame-emit = []

