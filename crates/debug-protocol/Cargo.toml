[package]
name                    = "tynd-debug-protocol"
description             = "JSON-RPC debug protocol transport and taps for the Tynd framework"
publish                 = false
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true
readme                  = "README.md"

[lib]
doctest = false

[lints]
workspace = true

[features]
default = []
local-socket = [ "dep:interprocess", "dep:windows-sys", "dep:widestring" ]

[dependencies]
crossbeam-channel.workspace  = true
interprocess                 = { workspace = true, optional = true }
parking_lot.workspace        = true
serde.workspace              = true
serde_json.workspace         = true
subtle.workspace             = true
tracing.workspace            = true
tracing-subscriber.workspace = true

[target."cfg(windows)".dependencies]
widestring  = { version = "1", optional = true }
windows-sys = { version = "0.61", optional = true, features = [ "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading" ] }
