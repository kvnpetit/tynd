[workspace]
members = [ "packages/host-rs", "packages/full", "packages/lite" ]

# cargo-shear can't see consumers across workspace boundaries — these crates
# are declared here so sibling repos (../plugins, ../plugin-sdk) can pick them
# up via `workspace = true` when resolved through the path-deps graph during
# `tynd build`. They're not unused, just consumed off-tree.
[workspace.metadata.cargo-shear]
ignored = [
    "anyhow",
    "bidiff",
    "cap-tempfile",
    "fastrand",
    "global-hotkey",
    "portable-pty",
    "rusqlite",
    "thiserror",
    "user-idle",
]
# Generated/vendored trees that should not be members of the monorepo
# workspace. `packages/host-src/native/` is a flattened mirror of
# `packages/host-rs` produced by `bun run --cwd packages/host-src sync`;
# it's consumed by the ad-hoc workspace the CLI generates under
# `.tynd/build/` for custom runtimes.
#
# The plugin-sdk + 14 plugins live in sibling repos (`../plugin-sdk`,
# `../plugins`) — they have their own Cargo workspaces and are pulled in
# here via path deps for dev iteration but are not workspace members.
exclude  = [ "packages/host-src/native" ]
resolver = "2"

[workspace.package]
version       = "1.0.0"
edition       = "2021"
rust-version  = "1.83"
license       = "Apache-2.0"
repository    = "https://github.com/tynd-apps/tynd"
homepage      = "https://tynd.kvnpetit.com/"
documentation = "https://tynd.kvnpetit.com/docs"
authors       = [ "Kevin Petit <74395438+kvnpetit@users.noreply.github.com>" ]
keywords      = [ "desktop", "webview", "typescript", "bun", "gui" ]
categories    = [ "gui", "web-programming" ]
readme        = "../../README.md"

[workspace.dependencies]
# Shared foundations
serde      = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
tempfile   = "3.27"
dirs       = "6"
zstd       = { version = "0.13.3", default-features = false }
mimalloc   = { version = "0.1.48", default-features = false }

# wry / tao ecosystem
wry       = "0.55.0"
tao       = "0.35.0"
muda      = "0.17.2"
tray-icon = "0.22"

# OS integration
rfd         = "0.17.2"
arboard     = "3.6.1"
open        = { version = "5.3.3", features = [ "shellexecute-on-windows" ] }
pollster    = "0.4"
notify-rust = "4.15.0"
image       = { version = "0.25.10", default-features = false, features = [ "png", "ico", "bmp" ] }

# Embedded JS runtime (lite)
rquickjs = { version = "0.11.0", features = [ "full" ] }

# HTTP + binary encoding. `json` dropped — we parse via serde_json directly.
ureq   = { version = "2.12", default-features = false, features = [ "tls", "gzip", "brotli" ] }
base64 = "0.22"

# Cross-platform pseudo-terminal for the embedded terminal API
portable-pty = "0.9"

# Compute helpers
sha2   = { version = "0.10", default-features = false }
blake3 = { version = "1.5", default-features = false }
hmac   = { version = "0.12", default-features = false }

# Ed25519 signatures for the auto-updater manifest + binary integrity.
ed25519-dalek = { version = "2.2", default-features = false, features = [ "std" ] }

# File-based single-instance lock — replaces the unmaintained `single-instance`
# crate. `fslock` uses platform-native locking (`flock` on Unix, `LockFileEx`
# on Windows) on a path under `dirs::cache_dir()` and releases on process exit.
fslock = "0.2"
# Cross-platform local socket for forwarding argv/cwd from a 2nd launch
# to the 1st (Windows named pipe, Unix domain socket).
interprocess = "2.2"

# FS watcher (ReadDirectoryChangesW on Windows, FSEvents on macOS, inotify
# on Linux) + global hotkey manager for system-wide shortcuts.
notify        = "6.1"
global-hotkey = "0.5"
# Cross-platform recycle bin (IShellItem on Windows, NSFileManager trashItemAtURL
# on macOS, freedesktop.org Trash Spec on Linux).
trash = "5"
# User idle time — GetLastInputInfo (Win), CGEventSource (macOS), XScreenSaver (Linux).
user-idle = "0.6"

# Linux-only gtk3 bindings — needed so we can upcast tao's gtk::ApplicationWindow
# to the gtk::Window that muda's show_context_menu_for_gtk_window expects.
gtk = "0.18"

# Platform-specific notification backends with action callbacks — notify-rust
# only surfaces them on Linux. Windows: tauri-winrt-notification adds WinRT
# toasts + on_activated. macOS: mac-notification-sys adds action buttons +
# blocking send() whose return value tells us which button was clicked.
tauri-winrt-notification = "0.7"
mac-notification-sys     = "0.6"

# Launch-at-boot — registry on Windows, Launch Agents on macOS, autostart
# .desktop on Linux.
auto-launch = "0.5"

# Secure credential storage — Keychain (macOS), Credential Manager + DPAPI
# (Windows), Secret Service / kwallet (Linux).
keyring = { version = "3", features = [ "apple-native", "windows-native", "sync-secret-service" ] }

# CSPRNG + WebSocket + embedded SQL (lite parity with bun:sqlite)
rand        = { version = "0.8", default-features = false, features = [ "std", "std_rng" ] }
tungstenite = { version = "0.24", default-features = false, features = [ "rustls-tls-webpki-roots", "handshake" ] }
rusqlite    = { version = "0.32", features = [ "bundled" ] }

# Performance primitives
parking_lot = "0.12" # lock-free fast path + no poison handling (saves a branch per lock)
dashmap     = "6"    # shard-locked concurrent hashmap — drops Mutex<HashMap> contention
ahash       = "0.8"  # faster non-crypto hasher for small keys (sessions, routes)
# MPMC sync channel with `select!` macro + native timeouts. Drop-in for
# `std::sync::mpsc` on the BackendBridge event_rx loop.
crossbeam-channel = "0.5"
# Tiny non-crypto RNG — single file, zero deps. Use for jitter / pool
# slot picks / non-secure IDs. `rand` stays for CSPRNG (token gen, nonces).
fastrand = "2"
# Time-ordered, sortable IDs (UUIDv7, RFC 9562). Replaces ad-hoc rand-based
# IPC call IDs so traces sort temporally.
uuid = { version = "1", features = [ "v7" ] }
# Capability-based filesystem from Bytecode Alliance — `Dir` handle
# blocks `..`/symlink/abs-path escapes via `openat2` on Linux 5.6+ and
# equivalent on macOS/Windows. Defense-in-depth wrapper for the scope
# policy in `os::fs`.
cap-std      = "4"
cap-tempfile = "4"
# Cross-platform binary self-replacement primitive — handles the
# Windows file-lock dance (rename-then-delete-on-reboot) so the
# updater plugin doesn't reinvent the workaround.
self-replace = "1.5"

# Plugin SDK — sibling repo. Path dep keeps dev iteration fast; the CLI's
# `.tynd/build/` template substitutes a registry version when generating
# custom runtimes for end users.
tynd_plugin_sdk = { path = "../plugin-sdk/native" }

# Structured logging + error helpers — `tracing` for spans/JSON output,
# `anyhow` for app code with `.context()`, `thiserror` for typed public
# error enums in libraries (plugin-sdk).
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter", "fmt" ] }
anyhow             = "1.0"
thiserror          = "2.0"

# Cross-platform Ctrl+C / SIGTERM handler — installs a single OS-level
# signal trap (SetConsoleCtrlHandler on Windows, sigaction on Unix) and
# routes both SIGINT *and* SIGTERM (with the `termination` feature) into
# a Rust closure. ~250 lines, zero deps, MIT/Apache-2.0.
ctrlc = { version = "3.5", features = [ "termination" ] }

# Binary diff for delta updates (replaces full-binary downloads in the
# updater). `bidiff` over `bsdiff` — parallel scanning, divsufsort,
# lower memory footprint. Pair with zstd for compressed patches.
bidiff = "1.0"

# MIME detection from path extension — replaces a hand-rolled match arm
# that drifted whenever a new asset extension showed up.
mime_guess = "2"

# Strict UTF-8 query-string parser — dropping the in-house `parse_query`
# + `url_decode` pair removed a silent UTF-8 fallthrough bug.
form_urlencoded = "1.2"

# Windows UNC normalize — `dunce::canonicalize` returns plain drive
# paths instead of `\\?\C:\…` so `Path::starts_with(base)` keeps
# matching after canonicalization in the dev-mode path-traversal guard.
dunce = "1.0"

# Cargo-safe slug for app-name → on-disk directory. Replaces an inline
# sanitizer in `webview_data_dir`.
slug = "0.1"

# Pattern matching for the security policy globs. Drops a hand-rolled
# recursive matcher and fixes a `\\` → `/` asymmetry on Windows.
globset = "0.4"

# `gethostname()` wrapper without shelling out to `hostname(1)`.
hostname = "0.4"

# OS version via WMI / sw_vers / uname — locale-independent, replaces
# the brittle `cmd /c ver` parser that broke on non-EN Windows.
os_info = "3.12"

# Dark-mode detection through the freedesktop XDG portal D-Bus call,
# Win32 Registry, and CFPreferences — handles KDE / sway / Flatpak that
# the old `gsettings` shell-out missed.
dark-light = "2.0"

# BCP-47 locale via `GetUserDefaultLocaleName` (Win),
# `[NSLocale currentLocale]` (macOS), and `LC_*` env (Linux).
sys-locale = "0.3"

# Debounced FS watcher — collapses multi-event renames + tracks paths
# across moves. Sits on top of `notify` and keeps the same OS backend.
notify-debouncer-full = "0.7"

[workspace.lints.rust]
unused_must_use               = "deny"
unsafe_op_in_unsafe_fn        = "deny"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_lifetimes              = "warn"
unused_qualifications         = "warn"
rust_2018_idioms              = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pragmatic allows on top of pedantic — noise without real safety gain
module_name_repetitions  = "allow"
must_use_candidate       = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
cast_precision_loss      = "allow"
cast_lossless            = "allow"
similar_names            = "allow"
too_many_lines           = "allow"
doc_markdown             = "allow"

# Bug-catchers — real safety gains
dbg_macro           = "warn"
todo                = "warn"
unimplemented       = "warn"
panic_in_result_fn  = "warn"
mem_forget          = "warn"
lossy_float_literal = "warn"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
debug         = false
incremental   = false

[profile.dev]
opt-level = 0

# Build deps with light opt so debug iteration stays fast without tanking runtime speed
[profile.dev.package."*"]
opt-level = 1
