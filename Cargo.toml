[workspace]
members = [ "packages/host-rs", "packages/full", "packages/lite" ]
# Generated/vendored trees that should not be members of the monorepo
# workspace. `packages/host-src/native/` is a flattened mirror of
# `packages/host-rs` produced by `bun run --cwd packages/host-src sync`;
# it's consumed by the ad-hoc workspace the CLI generates under
# `.tynd/build/` for custom runtimes.
#
# The plugin-sdk + 14 plugins live in sibling repos (`../plugin-sdk`,
# `../plugins`) — they have their own Cargo workspaces and are pulled in
# here via path deps for dev iteration but are not workspace members.
exclude  = [ "packages/host-src/native" ]
resolver = "2"

# cargo-shear can't see consumers across workspace boundaries — these crates
# are declared here so sibling repos (../plugins, ../plugin-sdk) can pick them
# up via `workspace = true` when resolved through the path-deps graph during
# `tynd build`. They're not unused, just consumed off-tree.
[workspace.metadata.cargo-shear]
ignored = [
    "anyhow",
    "bidiff",
    "bipatch",
    "cap-tempfile",
    "fastrand",
    "portable-pty",
    "rusqlite",
    "thiserror",
    # Staged for future code — declared at the workspace level so consumers
    # (host-rs feature flags, future plugins) can opt in via `workspace = true`
    # without re-pinning versions. Shear them when wired:
    "base64-simd",   # SIMD base64 fallback for binary IPC string transit
    "swift-rs",      # Swift↔Rust bridge for niche macOS-native APIs
    # Async WebSocket scaffolding — staged behind `tynd-host/ws-async`,
    # not yet wired to the dispatcher (see `os::websocket` follow-up).
    # Carrying the version pin here avoids cargo-shear flagging the
    # workspace declaration as dead while the implementation lands
    # incrementally.
    "tokio",
    "tokio-tungstenite",
    "tokio-util",
]

[workspace.package]
version       = "1.0.0"
publish       = false
edition       = "2021"
rust-version  = "1.83"
license       = "Apache-2.0"
repository    = "https://github.com/tynd-apps/tynd"
homepage      = "https://tynd.kvnpetit.com/"
documentation = "https://tynd.kvnpetit.com/docs"
authors       = [ "Kevin Petit <74395438+kvnpetit@users.noreply.github.com>" ]
keywords      = [ "desktop", "webview", "typescript", "bun", "gui" ]
categories    = [ "gui", "web-programming" ]
readme        = "../../README.md"

[workspace.dependencies]
# Shared foundations
serde      = { version = "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
tempfile   = "3.27"
dirs       = "6"
zstd       = { version = "0.13.3", default-features = false }
mimalloc   = { version = "0.1.48", default-features = false }

# wry / tao ecosystem
wry       = "0.55.0"
tao       = "0.35.0"
muda      = "0.17.2"
tray-icon = "0.22"
# Standalone DPI primitives (`LogicalPosition`, `PhysicalSize`, …) shared by
# the wry/tao ecosystem. Re-exported from `tynd-host` so consumer crates
# (presets, custom runtimes, plugins) can type their window commands against
# the same canonical types without depending on tao directly.
dpi       = "0.1"

# OS integration
rfd         = "0.17.2"
arboard     = "3.6.1"
open        = { version = "5.3.3", features = [ "shellexecute-on-windows" ] }
pollster    = "0.4"
notify-rust = "4.15.0"
image       = { version = "0.25.10", default-features = false, features = [ "png", "ico", "bmp" ] }

# Embedded JS runtime (lite)
rquickjs = { version = "0.11.0", features = [ "full" ] }

# HTTP + binary encoding. `json` dropped — we parse via serde_json directly.
ureq   = { version = "2.12", default-features = false, features = [ "tls", "gzip", "brotli" ] }
base64 = "0.22"

# Cross-platform pseudo-terminal for the embedded terminal API
portable-pty = "0.9"

# Compute helpers. `sha2` enables `asm` only on Unix targets in
# consumer crates (per-target table) — the `sha2-asm` build script
# shells out to `as`/`gcc` and doesn't bind through MSVC's `cl.exe`,
# so Windows builds fall back to the SIMD intrinsics path
# (`cpufeatures` runtime detection — already 1.5-2× over the pure-Rust
# fallback). `blake3` carries `rayon` here so the workspace shares one
# version pin; large-input hashing parallelizes across cores.
sha2   = { version = "0.10", default-features = false }
blake3 = { version = "1.5", default-features = false, features = [ "rayon" ] }
hmac   = { version = "0.12", default-features = false }

# Ed25519 signatures for the auto-updater manifest + binary integrity.
ed25519-dalek = { version = "2.2", default-features = false, features = [ "std" ] }

# File-based single-instance lock — replaces the unmaintained `single-instance`
# crate. `fslock` uses platform-native locking (`flock` on Unix, `LockFileEx`
# on Windows) on a path under `dirs::cache_dir()` and releases on process exit.
fslock = "0.2"
# Cross-platform local socket for forwarding argv/cwd from a 2nd launch
# to the 1st (Windows named pipe, Unix domain socket).
interprocess = "2.2"
# Windows registry access — used by `os::deep_link` to write the
# per-user `HKCU\Software\Classes\<scheme>\…` entries that bind a
# custom URL scheme to the running binary. Only consumed inside a
# `cfg(target_os = "windows")` block on the host crate, but declared
# at the workspace level so the version stays coherent if other
# Windows-only code paths ever need it.
#
# `windows-registry` is the canonical typed wrapper from the
# `microsoft/windows-rs` org — same import-lib resolution model as
# `windows-sys` (which we already pull). Replaces the older `winreg`
# crate, which is unmaintained.
windows-registry = "0.5"

# FS watcher: consumed exclusively through `notify_debouncer_full::notify::*`,
# so the standalone `notify` crate is not declared here. Keep the global
# hotkey manager for system-wide shortcuts.
global-hotkey = "0.5"
# Cross-platform recycle bin (IShellItem on Windows, NSFileManager trashItemAtURL
# on macOS, freedesktop.org Trash Spec on Linux).
trash = "5"
# User idle time — GetLastInputInfo (Win), CGEventSource (macOS), XScreenSaver (Linux).
user-idle = "0.6"

# Linux-only gtk3 bindings — needed so we can upcast tao's gtk::ApplicationWindow
# to the gtk::Window that muda's show_context_menu_for_gtk_window expects.
gtk = "0.18"

# Platform-specific notification backends with action callbacks — notify-rust
# only surfaces them on Linux. Windows: tauri-winrt-notification adds WinRT
# toasts + on_activated. macOS: mac-notification-sys adds action buttons +
# blocking send() whose return value tells us which button was clicked.
tauri-winrt-notification = "0.7"
mac-notification-sys     = "0.6"

# Launch-at-boot — registry on Windows, Launch Agents on macOS, autostart
# .desktop on Linux.
auto-launch = "0.5"

# Secure credential storage — Keychain (macOS), Credential Manager + DPAPI
# (Windows), Secret Service / kwallet (Linux). Per-OS feature gating in
# consumer crates avoids cross-platform feature pollution. The base entry
# below carries the shared version pin so consumers can `workspace = true`
# from a per-target table; `default-features = false` prevents the
# combined feature set from leaking into builds.
keyring = { version = "3", default-features = false }

# CSPRNG + WebSocket + embedded SQL (lite parity with bun:sqlite)
rand        = { version = "0.8", default-features = false, features = [ "std", "std_rng" ] }
tungstenite = { version = "0.24", default-features = false, features = [ "rustls-tls-webpki-roots", "handshake" ] }
rusqlite    = { version = "0.32", features = [ "bundled" ] }

# Async WebSocket primitives (scaffold only — see `os::websocket`
# `ws-async` feature). Tokio runtime is spawned on-demand inside the
# `ws-async` impl so default sync-tungstenite builds stay fully
# blocking-IO. Versions pinned here keep the workspace coherent when
# the full migration lands. `tokio-tungstenite 0.29` collapses the
# rustls 0.22 + 0.23 duplication (carries 0.23 only) and removes the
# 25 ms read-timeout busy-poll latency floor inherent to the blocking
# `set_read_timeout` polling pattern.
tokio              = { version = "1", default-features = false, features = [ "rt-multi-thread", "macros", "sync", "net", "time", "io-util" ] }
tokio-tungstenite  = { version = "0.29", default-features = false, features = [ "rustls-tls-webpki-roots", "handshake" ] }
tokio-util         = { version = "0.7", default-features = false }

# Performance primitives
parking_lot = "0.12" # lock-free fast path + no poison handling (saves a branch per lock)
# Lock-free `Arc<T>` swap for read-mostly state (security policy + ACL
# authority). Reads compile down to a single atomic load; writes do an
# `Arc::new(...).store(...)` and never block readers. Used where the
# previous `RwLock<T>` made every check_* call pay a lock acquisition
# even when the policy hadn't changed in hours.
arc-swap    = "1"
dashmap     = "6"    # shard-locked concurrent hashmap — drops Mutex<HashMap> contention
ahash       = "0.8"  # faster non-crypto hasher for small keys (sessions, routes)
# MPMC sync channel with `select!` macro + native timeouts. Drop-in for
# `std::sync::mpsc` on the BackendBridge event_rx loop.
crossbeam-channel = "0.5"
# Tiny non-crypto RNG — single file, zero deps. Use for jitter / pool
# slot picks / non-secure IDs. `rand` stays for CSPRNG (token gen, nonces).
fastrand = "2"
# SIMD JSON decoders — opt-in via `fast-json` on `tynd-full`. `sonic-rs`
# requires SSE4.2/AVX2 (x86_64 only); aarch64 falls back to `simd-json`
# which uses NEON. Default `serde_json` path stays everywhere these
# don't apply or the feature is off — sonic-rs / simd-json show 3-5×
# speedup on the IPC-frame decode hot path.
sonic-rs  = { version = "0.5", default-features = false }
simd-json = { version = "0.15", default-features = false, features = [ "serde_impl" ] }
# Hand-rolled CLI argument parser — 1 KB binary cost, designed for
# small flag sets. Replaces the 60-LOC `while i < raw.len()` loops in
# the launcher binaries (`tynd-full`, `tynd-lite`). `clap` would be
# overkill for these single-purpose entry points (which only take
# 2–4 flags) and is already pulled by `tynd-cli` / `tynd-bundler`.
pico-args = "0.5"
# Time-ordered, sortable IDs (UUIDv7, RFC 9562). Replaces ad-hoc rand-based
# IPC call IDs so traces sort temporally.
uuid = { version = "1", features = [ "v7" ] }
# Capability-based filesystem from Bytecode Alliance — `Dir` handle
# blocks `..`/symlink/abs-path escapes via `openat2` on Linux 5.6+ and
# equivalent on macOS/Windows. Defense-in-depth wrapper for the scope
# policy in `os::fs`.
cap-std      = "4"
cap-tempfile = "4"
# Cross-platform binary self-replacement primitive — handles the
# Windows file-lock dance (rename-then-delete-on-reboot) so the
# updater plugin doesn't reinvent the workaround.
self-replace = "1.5"

# Plugin SDK — sibling repo. Path dep keeps dev iteration fast; the CLI's
# `.tynd/build/` template substitutes a registry version when generating
# custom runtimes for end users.
tynd_plugin_sdk = { path = "../plugin-sdk/native" }

# Structured logging + error helpers — `tracing` for spans/JSON output,
# `anyhow` for app code with `.context()`, `thiserror` for typed public
# error enums in libraries (plugin-sdk).
tracing            = "0.1"
# Ajout `json` pour logs structurés en prod (ingestion centralisée
# style Loki/Datadog côté apps Tynd qui veulent observer leur backend).
tracing-subscriber = { version = "0.3", features = [ "env-filter", "fmt", "json" ] }
# Rolling-file writer + non-blocking sink for `tracing`. Picked over
# `fern` because the host already speaks `tracing` natively (panic
# hook, OTel layer, every `tynd_*!` macro) — `tracing-appender` is the
# canonical companion crate from the same org, and adding `fern`
# would force a `log → tracing` bridge we don't otherwise need.
tracing-appender   = "0.2"
# Human-readable byte-size parser (`"10 MiB" → 10_485_760`) for
# config-driven rotation thresholds. Standalone — no `serde`-locked
# dance with `humansize`/`bytesize`, just `Byte::parse_str`.
byte-unit          = "5"
anyhow             = "1.0"
thiserror          = "2.0"

# Cross-platform Ctrl+C / SIGTERM handler — installs a single OS-level
# signal trap (SetConsoleCtrlHandler on Windows, sigaction on Unix) and
# routes both SIGINT *and* SIGTERM (with the `termination` feature) into
# a Rust closure. ~250 lines, zero deps, MIT/Apache-2.0.
ctrlc = { version = "3.5", features = [ "termination" ] }

# Binary diff for delta updates (replaces full-binary downloads in the
# updater). `bidiff` over `bsdiff` — parallel scanning, divsufsort,
# lower memory footprint. Pair with zstd for compressed patches.
# `bidiff` is the diff side (used by the bundler to *produce* patches);
# `bipatch` is the patch side (used by the updater to *apply* them on
# the end-user machine). They share an on-disk format (`MAGIC = 0xB1DF`
# + version + varint-encoded controls) so a patch produced by one
# always round-trips through the other at the same major version.
bidiff  = "1.0"
bipatch = "1.0"

# MIME detection from path extension — replaces a hand-rolled match arm
# that drifted whenever a new asset extension showed up.
mime_guess = "2"

# MIME detection from byte signatures — `mime_guess` only looks at the
# extension, which lies whenever a frontend ships an asset with no
# extension or one that doesn't match its actual contents (e.g. an
# `.bin` file that's actually a PNG, a `.webp` produced by a converter
# that kept `.png`). `infer` peeks at the magic bytes and is the
# correct primary signal; we keep `mime_guess` as the extension-based
# fallback for plain text formats `infer` deliberately doesn't sniff.
infer = "0.19"

# Strict UTF-8 query-string parser — dropping the in-house `parse_query`
# + `url_decode` pair removed a silent UTF-8 fallthrough bug.
form_urlencoded = "1.2"

# Windows UNC normalize — `dunce::canonicalize` returns plain drive
# paths instead of `\\?\C:\…` so `Path::starts_with(base)` keeps
# matching after canonicalization in the dev-mode path-traversal guard.
dunce = "1.0"

# Cargo-safe slug for app-name → on-disk directory. Replaces an inline
# sanitizer in `webview_data_dir`.
slug = "0.1"

# Strict URL parser — replaces a hand-rolled `looks_like_url` that
# happily accepted `javascript:` / `data:` strings the host then
# forwarded to the `app:open-url` handler. `url::Url::parse` enforces
# RFC 3986 scheme + structure so we can scheme-allowlist on parsed
# input.
url = "2.5"

# Semver version parsing and requirement matching — used by the updater to
# compare `currentVersion` against the manifest version with full SemVer
# semantics (pre-release ordering, build-metadata stripping, req ranges).
semver = { version = "1.0", features = [ "serde" ] }

# Pattern matching for the security policy globs. Drops a hand-rolled
# recursive matcher and fixes a `\\` → `/` asymmetry on Windows.
globset = "0.4"

# RFC 6570-ish URL-pattern matcher (Chrome's `URLPattern` API as a
# crate). Used by the ACL layer for future per-URL grants — lets a
# capability scope to e.g. `https://*.example.com/api/*` instead of
# the cruder origin-only check we currently apply. Wired through the
# `acl::url_matches` helper.
urlpattern = "0.3"
# `urlpattern` is generic over a `RegExp` provider — `regex::Regex`
# already satisfies that trait and is the only practical choice on a
# stable Rust toolchain (the alternative would be `fancy-regex`,
# which doesn't add features urlpattern needs). Pulled here so
# `acl::url_matches` can name the type explicitly.
regex      = "1"

# Compile-time perfect-hash collections. Used for the static
# allowlists/denylists scattered across `os::*` (executable
# extensions, scheme allowlists, …) — `phf_set!` builds the hash at
# `cargo build` time so the runtime lookup is a single hash + slot
# compare instead of an O(N) `iter().any(...)`.
phf = { version = "0.11", features = ["macros"] }

# `gethostname()` wrapper without shelling out to `hostname(1)`.
hostname = "0.4"

# OS version via WMI / sw_vers / uname — locale-independent, replaces
# the brittle `cmd /c ver` parser that broke on non-EN Windows.
os_info = "3.12"

# Dark-mode detection through the freedesktop XDG portal D-Bus call,
# Win32 Registry, and CFPreferences — handles KDE / sway / Flatpak that
# the old `gsettings` shell-out missed.
dark-light = "2.0"

# BCP-47 locale via `GetUserDefaultLocaleName` (Win),
# `[NSLocale currentLocale]` (macOS), and `LC_*` env (Linux).
sys-locale = "0.3"

# Debounced FS watcher — collapses multi-event renames + tracks paths
# across moves. Sits on top of `notify` and keeps the same OS backend.
notify-debouncer-full = "0.7"

# === V1 hardening additions ===

# Generate TypeScript types from Rust IPC structs. Source-of-truth for
# `@tynd/core/client` — no manual `.d.ts` drift between Rust IPC commands
# and the typed JS proxy.
specta = { version = "2.0.0-rc.22", features = [ "derive" ] }

# UTF-8-guaranteed paths. Used at the IPC boundary to eliminate
# `.to_string_lossy()` data loss and OsStr footguns on Windows.
camino = { version = "1.1", features = [ "serde1" ] }

# Safely embed serde values into JS template literals — closes XSS
# surface in webview init scripts. Drop-in for `format!`-based injection.
serialize-to-javascript = "0.1"

# Native blur/material — macOS vibrancy + Windows 11 Mica/Acrylic/Tabbed.
# Same maintainer org as `tao` / `wry`.
window-vibrancy = "0.5"

# Embed `Info.plist` into a CLI binary's `__TEXT,__info_plist` section so
# direct invocations get entitlements (microphone, accessibility, ...)
# prompts on macOS. Build-time linker-section helper.
embed_plist = "1.2"

# RFC-compliant `data:` URL parser — custom-scheme handler receives data
# URLs from the WebView (image previews, paste, drag-drop). Replaces
# regex + manual base64 split.
data-url = "0.3"

# RAII cleanup that survives panic unwind — webview spawn/teardown,
# single-instance lock release, build temp-dir cleanup.
scopeguard = "1.2"

# === Tauri ecosystem standalone (réutilisables hors `tauri` runtime) ===

# Helpers config / HTML / assets / platform / ACL / resources / patterns
# / MIME. Pas de dep `tauri`/`tauri-runtime`. Donne accès à un système
# ACL/capabilities mature, l'injection CSP+nonce dans les HTML servis
# par le custom-scheme, parsing config TOML/JSON5, et helpers
# platform_target_triple cross-platform.
tauri-utils = { version = "2.9", features = [
    "config-toml",         # parse tynd.config.toml si introduit
    "config-json5",        # autorise commentaires/trailing commas dans config
    "resources",           # ResourcePaths + glob pour staging assets
    "schema",              # JSON Schema généré pour ACL manifests
    "compression",         # brotli pour assets précompressés
] }

# === Hot path IPC perf ===

# Refcounted zero-copy byte buffers. Remplace `Vec<u8>` partout dans
# l'IPC binaire — fan-out vers multi-webview = clone Arc gratuit au
# lieu de copier le payload.
bytes = "1.7"

# Sérialisation zero-copy binaire avec validation. 10-100× plus rapide
# que serde_json pour structures Rust↔Rust (host ↔ plugins natifs,
# host ↔ Bun process). serde_json reste sur l'edge JS où le runtime
# parle JSON nativement.
rkyv = { version = "0.8", features = ["bytecheck"] }

# Stack-allocated petits vecs. Args RPC font typiquement <8 items —
# évite l'alloc heap sur le hot path dispatch.
smallvec = { version = "1.13", features = ["serde", "union"] }

# === OS surface étendue (parité Tauri + différenciants) ===

# CPU/RAM/disque/processus cross-platform. Exposé via `os.systemStats()`
# côté JS — load avg, free mem, mounted disks, process tree.
sysinfo = { version = "0.32", default-features = false, features = [
    "system",   # CPU + memory
    "disk",     # mounted disks
    "network",  # network counters (hors interfaces — voir if-addrs)
] }

# Interfaces réseau (IPs locales, MAC, up/down). `os.network()`.
# `getifaddrs` (Unix) / `GetAdaptersAddresses` (Win).
if-addrs = "0.13"

# Unix syscalls (POSIX `kill(2)`, signals). Used by `os::process` to
# send `SIGTERM` / `SIGINT` / `SIGHUP` etc. — `Child::kill()` only
# exposes the SIGKILL escalator. Workspace-pinned so the version stays
# coherent if any future `cfg(unix)` consumer wants the same crate.
nix = { version = "0.30", default-features = false, features = [ "signal" ] }

# Screenshot écran/window — Tauri n'a PAS ça nativement, gain feature
# différenciant pour les apps de capture / annotation / partage écran.
xcap = "0.0.13"

# Battery info pour `power.battery()` — niveau, statut, temps restant.
battery = "0.7"

# === Sécu / UX prod ===

# Vault chiffré fichier (AES-GCM-SIV + scrypt). Plus léger qu'IOTA
# Stronghold, maintenance saine. Pour `keyring` étendu : storage
# secrets gros (clés API, tokens longs) hors limite size keychain.
cocoon = "0.4"

# Memory wiping for secrets (passwords, keys). `Zeroizing<T>` zeros the
# heap on drop — `Vec::drop` releases the allocation but doesn't scrub
# the bytes, so a future allocator can hand the same page out and a
# memory dump still finds the cleartext.
zeroize = { version = "1.8", features = ["zeroize_derive"] }

# Crash log lisible utilisateur final — installe un `panic_hook` qui
# génère un rapport markdown avec stack trace + path, message lisible
# au lieu du `thread 'main' panicked at ...` brut.
human-panic = "2"

# Touch ID (macOS) / Face ID (iOS) / Windows Hello / fingerprint
# (Linux fprintd) cross-platform. Pour `auth.requestBiometric()`.
robius-authentication = "0.1"

# === Optionnel ===

# SIMD base64 pour fallback du binary IPC quand un payload doit
# transiter en string (rare, mais hot quand ça arrive). Marked
# `optional = true` côté consommateur (host-rs) si gardé derrière
# une feature ; ici en workspace dep on ne peut pas le marquer.
base64-simd = "0.8"

# Bridge Swift↔Rust avec build.rs auto. Pour features macOS-natives
# (FSEvents avancés, NSAppleScript, AVFoundation) qui n'ont pas de
# bindings Rust idiomatiques. À tirer derrière une feature côté
# consommateur uniquement si un besoin spécifique macOS apparaît.
swift-rs = "1.0"

# Property-based testing (dev-only) — used by host-rs to fuzz path
# canonicalization invariants and updater semver ordering against the
# `semver` crate. Workspace-pinned so future test-only consumers stay
# on a coherent version.
proptest = "1"

# === Observability — production export pipelines (opt-in) ===
#
# OpenTelemetry traces export via OTLP (gRPC). Pulled only when the
# consumer enables the `obs-otel` feature on `tynd-host`. Pinned to the
# 0.28 line so it tracks `tracing-opentelemetry` exactly (one-to-one
# version coupling — `tracing-otel 0.28` requires `opentelemetry 0.28`).
opentelemetry         = { version = "0.28", default-features = false, features = [ "trace" ] }
opentelemetry_sdk     = { version = "0.28", default-features = false, features = [ "trace", "rt-tokio" ] }
opentelemetry-otlp    = { version = "0.28", default-features = false, features = [ "trace", "grpc-tonic" ] }
tracing-opentelemetry = { version = "0.28", default-features = false, features = [ "tracing-log" ] }

# Sentry crash reporter — paired with the tracing panic hook so user
# crashes ship with structured spans + breadcrumbs. `default-features
# = false` strips the platform-specific `debug-images` crate (we ship
# stripped release binaries anyway). The `transport` feature bundles
# the reqwest+tokio HTTPS sender along with `native-tls`, matching the
# rest of the workspace's networking layers; gated under the
# `obs-sentry` feature on `tynd-host`.
sentry = { version = "0.34", default-features = false, features = [ "backtrace", "contexts", "panic", "transport" ] }

[workspace.lints.rust]
unused_must_use               = "deny"
unsafe_op_in_unsafe_fn        = "deny"
missing_debug_implementations = "warn"
unreachable_pub               = "warn"
unused_lifetimes              = "warn"
unused_qualifications         = "warn"
rust_2018_idioms              = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pragmatic allows on top of pedantic — noise without real safety gain
module_name_repetitions  = "allow"
must_use_candidate       = "allow"
missing_errors_doc       = "allow"
missing_panics_doc       = "allow"
return_self_not_must_use = "allow"
cast_possible_truncation = "allow"
cast_sign_loss           = "allow"
cast_precision_loss      = "allow"
cast_lossless            = "allow"
similar_names            = "allow"
too_many_lines           = "allow"
doc_markdown             = "allow"
items_after_statements   = "allow"
unnecessary_wraps        = "allow"

# Bug-catchers — real safety gains
dbg_macro           = "warn"
todo                = "warn"
unimplemented       = "warn"
panic_in_result_fn  = "warn"
mem_forget          = "warn"
lossy_float_literal = "warn"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true
debug         = false
incremental   = false

# `tynd-lite` is the size-sensitive preset — it ships with an embedded
# QuickJS runtime, so we trade a bit of raw throughput for ~2-3 MB off
# the final binary. The rest of the workspace stays at `opt-level = 3`.
[profile.release.package.tynd-lite]
opt-level = "z"

[profile.dev]
opt-level = 0

# Build deps with light opt so debug iteration stays fast without tanking runtime speed
[profile.dev.package."*"]
opt-level = 1
