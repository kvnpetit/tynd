[package]
name                    = "tynd-host-core"
description             = "Core leaf utilities for the Tynd native host (IPC error builder, typed arg extraction, OS event bus)"
publish                 = false
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true
readme.workspace        = true

[lints]
workspace = true

# Zero-cycle leaf crate. Re-built only when a public type or one of the
# four files below changes — every other host crate (`host-os`,
# `host-app`, façade) compiles against a stable surface and benefits
# from cargo's per-crate incremental cache.
#
# Scope: pure types + tiny helpers. No platform-specific code, no
# feature gates. Anything pulling an OS dependency (image, tao,
# tray-icon, dashmap, parking_lot, ctrlc) lives in the consuming crate.
[dependencies]
serde.workspace      = true
serde_json.workspace = true
