[package]
name                    = "tynd-host"
description             = "Native WebView host for the Tynd framework (wry + tao + OS integration)"
publish                 = false
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true
readme.workspace        = true

build = "build.rs"

[lints]
workspace = true

# `swift-rs` ships `SwiftLinker` under its `build` feature. Only
# consumed inside the `cfg(all(target_os = "macos", feature =
# "swift-bridge"))` arm of `build.rs` — Cargo still resolves the dep
# on every target listed in this table, but Linux/Windows builds skip
# the table entirely. The crate itself is tiny (~few hundred lines).
[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { workspace = true, features = [ "build" ] }

[dependencies]
# Always-on — structural or used by more than one always-on module.
wry.workspace                = true
tao.workspace                = true
dpi.workspace                = true
serde.workspace              = true
serde_json.workspace         = true
specta.workspace             = true
pollster.workspace           = true
image.workspace              = true
muda.workspace               = true
tray-icon.workspace          = true
dirs.workspace               = true
zstd.workspace               = true
base64.workspace             = true
sha2.workspace               = true
blake3.workspace             = true
rand.workspace               = true
parking_lot.workspace        = true
shared_child.workspace       = true
fs-err.workspace             = true
walkdir.workspace            = true
rayon.workspace              = true
arc-swap.workspace           = true
dashmap.workspace            = true
ahash.workspace              = true
tempfile.workspace           = true
tracing.workspace            = true
tracing-subscriber.workspace = true
tracing-appender.workspace   = true
byte-unit.workspace          = true
ctrlc.workspace              = true
anyhow.workspace             = true
crossbeam-channel.workspace  = true
fastrand.workspace           = true
uuid.workspace               = true
cap-std.workspace            = true
cap-tempfile.workspace       = true
# Always-on URL/path/mime helpers used across scheme handlers + util.
mime_guess.workspace      = true
infer.workspace           = true
form_urlencoded.workspace = true
dunce.workspace           = true
slug.workspace            = true
# Strict URL parser used by `looks_like_url` to scheme-allowlist
# deep-link argv (rejects `javascript:` / `data:` / `file://./...`
# before they reach the `app:open-url` handler).
url.workspace             = true
semver.workspace          = true
# XSS-safe JS init-script serialization (replaces format!-based serde_json injection).
serialize-to-javascript.workspace = true
# Native blur/material effects — macOS vibrancy + Windows 11 Mica/Acrylic/Tabbed.
window-vibrancy.workspace         = true
# Embed Info.plist into the binary's __TEXT,__info_plist section on macOS.
embed_plist.workspace             = true
# UTF-8-guaranteed paths at the IPC boundary — eliminates OsStr footguns.
camino.workspace                  = true
# RAII cleanup that survives panic unwind — webview spawn/teardown temp resources.
scopeguard.workspace              = true
# RFC-compliant data: URL parser for custom-scheme and drag-drop handlers.
data-url.workspace                = true
# Always-on OS detection helpers. The `os::os_info` + `os::security`
# modules sit outside the `api-*` feature gates (they're consumed by
# every dispatch path), so their backing crates are too.
globset.workspace    = true
urlpattern.workspace = true
regex.workspace      = true
phf.workspace        = true
hostname.workspace   = true
os_info.workspace    = true
dark-light.workspace = true
sys-locale.workspace = true

# Always-on perf primitives + tauri ecosystem standalone.
# `bytes` / `smallvec` are used throughout the IPC + scheme handlers
# (zero-copy buffers, stack-allocated arg vecs). `tauri-utils` gives us
# platform helpers, CSP injection, and the ACL/capabilities manifest
# format without pulling the `tauri` runtime. `rkyv` is wired through
# the rkyv-vs-serde benches only — moved to `[dev-dependencies]`.
bytes.workspace       = true
smallvec.workspace    = true
tauri-utils.workspace = true
# Compact-strings — inline-stores short IPC IDs/labels (≤24 B on 64-bit)
# without heap alloc. Hot path on every dispatch.
compact_str.workspace = true
# SIMD hex encoder for the `tynd-bin://` hash response path.
faster-hex.workspace  = true

# Optional — pulled only when their matching `api-*` feature is enabled.
rfd                   = { workspace = true, optional = true }
arboard               = { workspace = true, optional = true }
open                  = { workspace = true, optional = true }
notify-rust           = { workspace = true, optional = true }
ureq                  = { workspace = true, optional = true }
fslock                = { workspace = true, optional = true }
interprocess          = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }
trash                 = { workspace = true, optional = true }
tungstenite           = { workspace = true, optional = true }
# Async WebSocket scaffolding — opt-in via `ws-async`. Default sync
# path stays on the always-on `tungstenite` blocking client; flipping
# `ws-async` on routes `os::websocket::run_session_with` through a
# tiny on-demand Tokio runtime so the 25 ms read-timeout busy-poll
# floor disappears. Skeleton only for now — full migration is staged
# in a follow-up sprint.
tokio                 = { workspace = true, optional = true }
tokio-tungstenite     = { workspace = true, optional = true }
tokio-util            = { workspace = true, optional = true }
ed25519-dalek         = { workspace = true, optional = true }
self-replace          = { workspace = true, optional = true }
# Binary patch applier — the inverse of `bidiff`. Reconstructs the new
# binary by reading a `bidiff::enc::Writer` patch over the currently
# running executable. Only pulled with `api-updater`; the diff side
# (`bidiff`) lives in the bundler crate.
bipatch               = { workspace = true, optional = true }
auto-launch           = { workspace = true, optional = true }
# `keyring` is gated per-OS in the `target.'cfg(...)'.dependencies` tables
# below — each platform pins exactly one backend feature
# (apple-native / windows-native / sync-secret-service) instead of
# carrying the union set. Kept optional so `api-keyring` can flip it off.
global-hotkey         = { workspace = true, optional = true }
user-idle             = { workspace = true, optional = true }

# New optional OS surface — gated behind matching `api-*` features so
# slim custom builds don't drag them in.
sysinfo               = { workspace = true, optional = true }
if-addrs              = { workspace = true, optional = true }
xcap                  = { workspace = true, optional = true }
battery               = { workspace = true, optional = true }
cocoon                = { workspace = true, optional = true }
robius-authentication = { workspace = true, optional = true }
# Memory wiping for vault password buffers. Tied to api-vault below.
zeroize               = { workspace = true, optional = true }

# Tauri-parity additions (V1) — all opt-in.
#
# `softbuffer`+`raw-window-handle`: CPU-buffer splash window, paint a
#   color/PNG before the webview is ready. Anti-flash on Windows cold
#   start. Gated behind `splash-screen`.
# `cookie_store`: standalone cookie jar used by plugins / forks that
#   want to share state outside the in-process ureq agent. Gated behind
#   `http-cookies` (no-op until consumers wire it).
# `rustls-platform-verifier`: OS-native TLS root cert chain
#   (Keychain/Win-crypto/NSS). Gated behind `tls-platform-verifier`;
#   plugins consume it directly through workspace dep.
softbuffer               = { workspace = true, optional = true }
raw-window-handle        = { workspace = true, optional = true }
cookie_store             = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }

rquickjs = { workspace = true, optional = true }

# Production observability — opt-in via the `obs-otel` / `obs-sentry`
# feature gates below. Bringing OpenTelemetry pulls a tokio runtime
# transitively (via `opentelemetry_sdk` rt-tokio + `opentelemetry-otlp`
# grpc-tonic), so default builds stay free of it.
opentelemetry         = { workspace = true, optional = true }
opentelemetry_sdk     = { workspace = true, optional = true }
opentelemetry-otlp    = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
sentry                = { workspace = true, optional = true }

# Native plugin contract. Pulled unconditionally — the trait + registry are
# tiny and the host always needs them to dispatch plugin calls when one
# or more native plugins are compiled in.
tynd_plugin_sdk.workspace = true

# Host proc-macros — `#[tynd::handler]` typed dispatch. Re-exported
# under the `tynd` ident at the crate root so user-facing call sites
# read `#[tynd::handler(api = "compute")]` without an extra `use`.
tynd-host-macros.workspace = true

[features]
# Preset builds (tynd-full / tynd-lite) get `default = ["api-all"]` so every
# OS API is compiled in. Custom builds pass `--no-default-features` and pick
# the exact set of `api-*` features they want, which also drops the matching
# crate dependencies from the compile graph.
default = [ "api-all" ]

# Embedded QuickJS runtime (lite only — keeps rquickjs out of full).
# Lite's JS polyfills call into `os::compute` (SubtleCrypto) and
# `os::websocket` (WebSocket), so those two APIs ride along mandatorily.
embedded-js = [ "dep:rquickjs", "api-compute", "api-websocket" ]

# Meta feature: every gatable OS API. Disabling this and picking a subset is
# how `runtime: "full-custom"` / `"lite-custom"` narrow the attack surface
# and binary size.
api-all = [
    "api-acl",
    "api-autolaunch",
    "api-biometric",
    "api-clipboard",
    "api-compute",
    "api-dialog",
    "api-fs",
    "api-http",
    "api-keyring",
    "api-log",
    "api-network",
    "api-notification",
    "api-power",
    "api-process",
    "api-screenshot",
    "api-shell",
    "api-shortcuts",
    "api-sidecar",
    "api-single-instance",
    "api-store",
    "api-system-stats",
    "api-theme",
    "api-updater",
    "api-vault",
    "api-websocket",
    "api-window-state",
    "api-deep-link",
    "api-keys",
    "api-cli",
    # Macros-only on macOS via per-target dep gating; harmless on
    # Linux/Windows (the dispatch arm short-circuits to api_disabled).
    "api-apple-script",
]

# Per-API gates. Each feature enables its module + dispatch arm + pulls the
# crate dependencies it needs. APIs with no external dep list nothing here.
# `api-acl` rides on the always-on `tauri-utils` dep — no extra crate.
api-acl             = [  ]

# Opt-in: re-enable tauri-utils' `schema` feature so derived JsonSchema
# helpers become available. The default `os::acl::generate_schema`
# function is hand-rolled JSON and does NOT need this — it ships in
# every preset for IDE autocomplete on `*.tynd-capability.json` files.
# This feature exists for future codegen tooling that wants the
# tauri-utils-derived schema (~1 MB extra on the binary, off by default).
acl-schema          = [ "tauri-utils/schema" ]
api-autolaunch      = [ "dep:auto-launch" ]
api-biometric       = [ "dep:robius-authentication" ]
api-clipboard       = [ "dep:arboard" ]
api-compute         = [  ]
api-dialog          = [ "dep:rfd" ]
api-fs              = [ "dep:notify-debouncer-full", "dep:trash" ]
api-http            = [ "dep:ureq" ]
api-keyring         = [ "dep:keyring" ]
api-log             = [  ]
api-network         = [ "dep:if-addrs" ]
api-notification    = [ "dep:notify-rust", "dep:tauri-winrt-notification", "dep:mac-notification-sys" ]
api-power           = [ "dep:user-idle", "dep:battery", "power-events-mac", "power-events-linux" ]
# Internal helper sub-features — let the per-target dep tables flip the
# matching crates on without leaking them on the wrong OS. `Cargo` skips
# `target.'cfg(...)'.dependencies` entries automatically when their
# `optional = true` deps aren't enabled, so `dep:zbus` resolves to a
# no-op on Windows / Linux respectively. `objc2` itself is not pulled
# directly — `objc2-app-kit` already re-exports the umbrella `objc2`
# crate as `objc2_app_kit::objc2`, so we save one optional-dep entry.
power-events-mac    = [ "dep:objc2-foundation", "dep:objc2-app-kit", "dep:block2" ]
power-events-linux  = [ "dep:zbus" ]
api-process         = [  ]
api-screenshot      = [ "dep:xcap" ]
api-shell           = [ "dep:open" ]
api-shortcuts       = [ "dep:global-hotkey" ]
api-sidecar         = [  ]
api-single-instance = [ "dep:fslock", "dep:interprocess" ]
api-store           = [  ]
api-system-stats    = [ "dep:sysinfo" ]
api-theme           = [  ]
api-updater         = [ "dep:ureq", "dep:ed25519-dalek", "dep:self-replace", "dep:bipatch" ]
# `cocoon` provides AES-GCM-SIV file vault — bigger-than-keychain
# secrets (long tokens, bundled credentials, encrypted plugin state).
# `zeroize` wipes password buffers on drop so a freed allocation can't
# leak the cleartext to a future allocator request.
api-vault           = [ "dep:cocoon", "dep:zeroize" ]
api-websocket       = [ "dep:tungstenite" ]
# Async WebSocket scaffold — feature flag + on-demand Tokio runtime
# infrastructure. When OFF (the default), `os::websocket` keeps the
# blocking `tungstenite` poll-with-timeout loop. When ON, callers can
# opt into the future async dispatcher (still WIP — full implementation
# tracked separately). Pulling this also pulls a small Tokio runtime,
# so opt-in is gated to deployments that actually want it.
ws-async            = [ "dep:tokio", "dep:tokio-tungstenite", "dep:tokio-util" ]
# Window-state persistence — promoted from `@tynd/plugin-window-state`.
# No external dep: rides on always-on `dirs` + `serde_json` + `parking_lot`.
api-window-state    = [  ]
# Deep-link OS API — scheme registration (HKCU on Windows,
# LSSetDefaultHandlerForURLScheme on macOS, .desktop on Linux) plus
# multi-instance URL forwarding (master file lock + local socket, same
# `fslock`/`interprocess` building blocks as `api-single-instance`).
# `windows-registry` is the only Windows-only dep — declared optional in
# the `target.'cfg(target_os = "windows")'.dependencies` table below so
# it only resolves on Windows builds.
api-deep-link       = [ "dep:fslock", "dep:interprocess", "dep:windows-registry" ]
# Browser key intercept (Ctrl+R, F5, …). Pure logic — no external dep.
api-keys            = [  ]
# Process argv parsing exposed to the frontend. Pure logic — no external dep.
api-cli             = [  ]

# WIRE FORMAT GATE — `process.spawn`'s stdout/stderr stream chunk shape.
#
# Default (this feature OFF) emits `{ data: "<base64>" }` per chunk:
# 25× smaller on the wire than the legacy `Number[]` array (1 byte = 1
# JSON number = 1-3 ASCII chars + comma) and ~50× cheaper to serialize
# on the host (no per-byte `Value::from(u32)` allocation). Frontend
# decodes via `atob(data)` → `Uint8Array.from(...)`.
#
# Opt INTO `process-bytes-array` to restore the legacy
# `{ data: number[] }` shape — for plugins / forks pinned to the old
# wire contract that haven't migrated their consumers yet. New code
# should leave this OFF and use the base64 path.
process-bytes-array = [  ]

# Production observability — strictly opt-in. Both gates are off by
# default (including in `api-all`) because the OTel + Sentry pipelines
# pull tokio + reqwest + tonic which would inflate every preset build.
# Apps that want either pipeline rebuild with `--features obs-otel` or
# `--features obs-sentry` (or both); at runtime they still need to
# initialize via `observability::init({ otel, sentry })` so a feature
# being compiled in doesn't auto-export anything.
obs-otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]
obs-sentry = [ "dep:sentry" ]

# === Tauri-parity additions ===

# CPU-buffer splash window — painted before the webview spawns to
# eliminate the white-flash that wry exhibits during init on Windows
# cold start. `os::splash` exposes `show(SplashConfig) -> SplashHandle`
# + `handle.close()`. The actual paint runs on the main thread (tao's
# event loop) so callers must hold the handle until the webview is
# attached. Off by default — opt in via `tynd.config.ts`'s
# `splash.enabled = true` (CLI flips this feature when generating the
# launcher main.rs for that build).
splash-screen = [ "dep:softbuffer", "dep:raw-window-handle" ]

# Persistent HTTP cookie jar — workspace-pinned `cookie_store` for
# plugin / fork consumers (the in-process ureq agent will gain its
# own jar in the ureq3 follow-up, see workspace Cargo.toml note). The
# feature exists today so consumers can `workspace = true` without
# repinning the version.
http-cookies = [ "dep:cookie_store" ]

# OS-native TLS root cert chain — opt-in for enterprise / corp-CA
# users who can't manage webpki-roots. Pulls
# `rustls-platform-verifier` (OS Keychain/Win-crypto/NSS); the actual
# wire-up to ureq's `TlsConfig` lands with the ureq3 migration. The
# crate is workspace-shared so plugins can depend on the same
# version when they ship their own HTTP clients.
tls-platform-verifier = [ "dep:rustls-platform-verifier" ]

# === macOS-only Tauri-parity additions ===
#
# Both gates are no-ops on Linux/Windows (the deps live in the
# `target.'cfg(target_os = "macos")'.dependencies` table below).
# `api-apple-script` exposes `os.appleScript.run(script)` via osakit;
# `swift-bridge` lights up the swift-rs bridge and forces a build.rs
# pass that compiles the bundled Swift sources under `host-rs/swift/`.

# AppleScript runner (macOS only). Wires `os::apple_script::run(...)`
# behind the dispatch table — frontends hit `os.appleScript.run("tell
# app \"Finder\" ...")` and get the OSA result back. On non-mac builds
# the dispatch arm short-circuits to `api_disabled("apple-script")`.
# `dep:osakit` resolves only on macOS targets thanks to the
# `target.'cfg(target_os = "macos")'.dependencies` table — toggling
# this feature on Linux/Windows is a no-op at link time.
api-apple-script = [ "dep:osakit" ]

# Swift↔Rust bridge (macOS only). Lights up `os::macos_swift` (smoke
# test: `get_system_uptime_swift()` via NSProcessInfo) and pulls in
# the `build.rs` step that compiles the Swift sources. Plugin authors
# can extend by dropping `.swift` files under `host-rs/swift/` and
# declaring extern bindings in `os::macos_swift`. `dep:swift-rs`
# resolves only on macOS — non-mac builds skip the build script
# entirely (see `build.rs::main`).
swift-bridge = [ "dep:swift-rs" ]

[target.'cfg(unix)'.dependencies]
# POSIX `kill(2)` for `os::process::kill` — `Child::kill()` always sends
# SIGKILL, so we go through `nix::sys::signal::kill` to honour the
# requested signal name (SIGTERM / SIGINT / SIGHUP …). Pulled
# unconditionally on Unix targets — `os::process` is part of every
# preset and the dep is small (no transitive deps with `default-features = false`).
nix = { workspace = true }
# Hand-rolled assembly path for SHA-2 — pulls `sha2-asm`'s `cc` build
# script which only resolves `as`/`gcc` toolchains. 2-3× over the
# `cpufeatures` SIMD fallback on x86_64 / aarch64. Windows builds
# can't use this (MSVC `cl.exe` doesn't grok `.S` files) and stay on
# the intrinsics path — still 1.5-2× over pure Rust.
sha2 = { version = "0.10", default-features = false, features = [ "asm" ] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux needs the wayland-data-control feature on arboard; re-declared here
# as optional so it's only pulled with api-clipboard.
arboard       = { version = "3", features = [ "wayland-data-control" ], optional = true }
# Keyring on Linux uses Secret Service (sync) — kwallet/gnome-keyring
# both expose the same DBus surface. Avoids the async-secret-service
# variant which would pull tokio.
keyring       = { version = "3", default-features = false, features = [ "sync-secret-service" ], optional = true }
gtk.workspace = true
# systemd-logind DBus signals (PrepareForSleep, Session.Lock/Unlock) for
# the `os::power` watcher. `default-features = false` + `blocking-api`
# keeps the async-io runtime out of the dep graph — the watcher runs on
# its own dedicated `std::thread`.
zbus = { version = "5.14", default-features = false, features = [ "blocking-api" ], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = { workspace = true, optional = true }
# Keyring on Windows uses Credential Manager + DPAPI via the native
# windows-native backend; avoids the legacy `winapi` shim path.
keyring                  = { version = "3", default-features = false, features = [ "windows-native" ], optional = true }
# Per-user `HKCU\Software\Classes\<scheme>` registry write/read for the
# deep-link OS API. Only consumed in `os::deep_link::registry` (Windows
# only); kept optional here so non-Windows builds and `api-deep-link`-off
# builds skip the dep entirely. `windows-registry` replaces the
# unmaintained `winreg` crate with the typed wrapper from microsoft/windows-rs.
windows-registry = { workspace = true, optional = true }
# Direct Win32 access for runtime-only features tao doesn't surface: DWM
# system backdrop (Mica/Acrylic/Tabbed) and ITaskbarList3::SetOverlayIcon.
# 0.61 introduces `windows-link` (raw-dylib resolution) which drops the
# 6 MB `windows-targets` import-lib bloat the older 0.59 line pulled in.
#
# `Win32_System_RemoteDesktop` + `Win32_System_LibraryLoader` +
# `Win32_Graphics_Gdi` are pulled by the `os::power` watcher: it spawns
# a hidden message-only window (`HWND_MESSAGE`) and registers
# `WTSRegisterSessionNotification` against it so `WM_POWERBROADCAST`
# (suspend/resume) and `WM_WTSSESSION_CHANGE` (lock/unlock) get pumped
# into the host event bus. `WNDCLASSEXW` references `HBRUSH` (Gdi) and
# `GetModuleHandleW` lives in `LibraryLoader`.
windows-sys = { version = "0.61", features = [ "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader" ] }

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = { workspace = true, optional = true }
# Keyring on macOS uses Keychain via the apple-native backend
# (Security.framework — `SecItemAdd`/`SecItemCopyMatching`).
keyring              = { version = "3", default-features = false, features = [ "apple-native" ], optional = true }
# AppleScript runner (osakit) — wired through `os::apple_script` behind
# `api-apple-script`. macOS-only crate; declared here so non-mac
# builds skip it entirely. `os::apple_script` itself is `#[cfg(...)]`
# on `target_os = "macos"` so the dispatch arm short-circuits when
# the platform doesn't apply.
osakit               = { workspace = true, optional = true }
# Swift↔Rust bridge — see `os::macos_swift`. The crate is tiny
# (header-only macros + a tiny runtime), but enabling the bridge
# requires the `host-rs/build.rs` step to compile the bundled Swift
# sources, so we gate via the `swift-bridge` feature.
swift-rs             = { workspace = true, optional = true }
# NSWorkspace.notificationCenter observers for the `os::power` watcher
# (sleep/wake + session active/inactive). Only pulled with `api-power`
# so non-power builds stay free of objc2-app-kit's generated bindings.
# The umbrella `objc2` crate is reached via `objc2_app_kit::objc2` /
# `objc2_foundation::objc2`, so we don't declare it directly.
objc2-foundation = { version = "0.3", default-features = false, features = [ "std", "NSString", "NSNotification", "NSOperation", "block2" ], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = [ "std", "NSWorkspace" ], optional = true }
block2 = { version = "0.6", optional = true }

# Criterion drives the IPC + plugin-dispatch micro-benches under
# `benches/`. Pulled at dev only — never linked into the shipped host.
# License: Apache-2.0 OR MIT (matches our workspace policy).
[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = [ "cargo_bench_support" ] }
# Property-based testing — fuzz path canonicalization invariants
# (`os/fs.rs`) and updater semver ordering (`os/updater.rs`) against
# the `semver` crate. Test-only; never linked into release builds.
proptest = { workspace = true }
# Diff side of the BSDIFF format — only needed in tests so the
# `os::updater` patch round-trip can construct a synthetic patch and
# feed it through the same `bipatch::Reader` the production code uses.
# `enc` feature pulls the `simple_diff` writer.
bidiff = { workspace = true, features = [ "enc" ] }
# Zero-copy binary serialization — the rkyv-vs-serde benches under
# `benches/ipc_rkyv_vs_serde.rs` are the only consumers right now.
# Promoted out of the always-on graph so default builds don't pay the
# bytecheck/munge cost; flip back to `[dependencies]` when wired into
# host↔plugin or host↔Bun edges.
rkyv = { workspace = true }
# CBOR binary IPC encoder/decoder — the U1 Layer 1 wire format on the
# Bun↔host edge. Used by the `ipc_binary_frame` bench to compare
# serde_json (baseline) vs ciborium vs rkyv on a typical IPC frame.
# Already promoted to a regular dep on `tynd-full` behind the
# `binary-ipc` feature; the host-rs side keeps it dev-only since the
# host doesn't speak CBOR directly (the Bun bridge owns that edge).
ciborium = { workspace = true }

# `harness = false` lets criterion's own runner take over from libtest,
# which is what gives us the criterion HTML reports + per-bench
# regression detection. Each file under `benches/` needs its own entry.

[[bench]]
name    = "ipc_eval_str"
harness = false

[[bench]]
name    = "ipc_yield_batch"
harness = false

[[bench]]
name    = "scheme_bin"
harness = false

[[bench]]
name    = "plugin_dispatch"
harness = false

[[bench]]
name    = "ipc_rkyv_vs_serde"
harness = false

[[bench]]
name    = "ipc_binary_frame"
harness = false

[[bench]]
name    = "fs_acl"
harness = false
