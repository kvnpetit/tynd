[package]
name                    = "tynd-lite"
description             = "Tynd runtime (lite) — embedded QuickJS backend + launcher"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true
readme.workspace        = true

[lib]
name = "tynd_lite"
path = "src/lib.rs"

[[bin]]
name = "tynd-lite"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# `embedded-js` is mandatory for the lite runtime; `default-features = false`
# lets the CLI pick an `api-*` subset for `runtime: "lite-custom"`. The
# default `preset` feature below restores the full API surface + bundled
# plugins for the shipped `tynd-lite` preset.
tynd-host            = { path = "../host-rs", default-features = false, features = ["embedded-js"] }
rquickjs.workspace   = true
serde.workspace      = true
serde_json.workspace = true
mimalloc.workspace   = true
ureq.workspace        = true
base64.workspace      = true
tungstenite.workspace = true
hmac.workspace        = true
sha2.workspace        = true
parking_lot.workspace = true

# Every official plugin — same list as tynd-full. `bundled-plugins` flips
# them all on for the preset. Custom builds skip the feature entirely.
tynd_plugin_sql               = { path = "../../../plugins/sql/native", optional = true }
tynd_plugin_terminal          = { path = "../../../plugins/terminal/native", optional = true }
tynd_plugin_updater           = { path = "../../../plugins/updater/native", optional = true }
tynd_plugin_keyring           = { path = "../../../plugins/keyring/native", optional = true }
tynd_plugin_autolaunch        = { path = "../../../plugins/autolaunch/native", optional = true }
tynd_plugin_shortcuts         = { path = "../../../plugins/shortcuts/native", optional = true }
tynd_plugin_power             = { path = "../../../plugins/power/native", optional = true }
tynd_plugin_log               = { path = "../../../plugins/log/native", optional = true }
tynd_plugin_clipboard_history = { path = "../../../plugins/clipboard-history/native", optional = true }

[features]
default = ["preset"]
preset  = ["tynd-host/api-all", "bundled-plugins"]

bundled-plugins = [
    "dep:tynd_plugin_sql",
    "dep:tynd_plugin_terminal",
    "dep:tynd_plugin_updater",
    "dep:tynd_plugin_keyring",
    "dep:tynd_plugin_autolaunch",
    "dep:tynd_plugin_shortcuts",
    "dep:tynd_plugin_power",
    "dep:tynd_plugin_log",
    "dep:tynd_plugin_clipboard_history",
]
