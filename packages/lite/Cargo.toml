[package]
name                    = "tynd-lite"
description             = "Tynd runtime (lite) — embedded QuickJS backend + launcher"
publish                 = false
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true
readme.workspace        = true

build = "build.rs"

[build-dependencies]
# Pre-compress the JS polyfill bundle at build time so the runtime
# binary embeds a ~14 KB zstd blob instead of ~50 KB of raw JS (B50).
# `default-features = false` matches the workspace pin and avoids
# pulling features the build script doesn't need.
zstd = { workspace = true }

[lib]
name = "tynd_lite"
path = "src/lib.rs"

[[bin]]
name = "tynd-lite"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# `embedded-js` is mandatory for the lite runtime; `default-features = false`
# lets the CLI pick an `api-*` subset for `runtime: "lite-custom"`. The
# default `preset` feature below restores the full API surface for the
# shipped `tynd-lite` preset.
#
# NOTE: `tynd-lite` ships with NO bundled plugins by default — keeps the base
# binary lightweight (the lite runtime philosophy). Apps that need plugins
# declare them in `tynd.config.ts`; the CLI generates a custom Cargo.toml
# under `.tynd/build/` that pulls only what the app actually uses.
tynd-host            = { path = "../host-rs", default-features = false, features = ["embedded-js"] }
rquickjs.workspace   = true
serde.workspace      = true
serde_json.workspace = true
mimalloc.workspace   = true
# Runtime decompression of the build-time-zstd-pre-compressed polyfill
# bundle (B50). The build script writes `OUT_DIR/polyfills.zst`; the
# runtime decodes it once via `OnceLock` on first polyfill install.
zstd.workspace       = true
ureq.workspace        = true
base64.workspace      = true
# tungstenite — WebSocket impl is fully delegated to `tynd_host`; lite
# doesn't link tungstenite directly. Removed by cargo-shear hygiene.
hmac.workspace        = true
sha2.workspace        = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
# Hand-rolled CLI replaced by pico-args — see `args.rs`.
pico-args.workspace   = true
# Pretty-prints panics for the end user (markdown crash report path,
# friendly message). Setup in main.rs via `human_panic::setup_panic!()`.
human-panic.workspace = true

[features]
default = ["preset"]
preset  = ["tynd-host/api-all", "deep-link"]

# Local mirror of `tynd-host/api-deep-link`. Calling
# `tynd_host::os::deep_link::init()` early in `run()` (before the event
# loop) is a `cfg(feature = ...)`-gated block that needs a feature on
# *this* crate; this gate is the bridge. Custom builds that drop deep-
# link from `tynd-host/api-*` should also drop it here.
deep-link = ["tynd-host/api-deep-link"]
