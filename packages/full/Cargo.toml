[package]
name                    = "tynd-full"
description             = "Tynd runtime (full) — Bun subprocess backend + embedded launcher"
publish                 = false
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true
readme.workspace        = true

[lib]
name = "tynd_full"
path = "src/lib.rs"

[[bin]]
name = "tynd-full"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Host is wired with `default-features = false` so `tynd-full` can flip the
# preset (all OS APIs) on via its own `default = ["preset"]` feature, or
# be built as a slim custom variant via
# `cargo build -p tynd-full --no-default-features --features "tynd-host/api-fs"`
# the way the CLI does for `runtime: "full-custom"`.
#
# NOTE: `tynd-full` ships with NO bundled plugins by default — keeps the base
# binary lightweight. Apps that need plugins (sql, terminal, audio, llm, etc.)
# declare them in `tynd.config.ts`; the CLI generates a custom Cargo.toml
# under `.tynd/build/` that pulls only the plugins the app actually uses.
tynd-host            = { path = "../host-rs", default-features = false }
serde.workspace      = true
serde_json.workspace = true
mimalloc.workspace   = true
zstd.workspace       = true
dirs.workspace       = true
crossbeam-channel.workspace = true
# Hand-rolled CLI replaced by pico-args — see `args.rs`. Tiny enough
# that the binary cost vs the 60-LOC loop is a wash, but the dev
# ergonomics (free, finish_arguments_or_exit) are worth it.
pico-args.workspace   = true
# Pretty-prints panics for the end user (markdown crash report path,
# friendly message instead of `thread 'main' panicked at ...`). Setup
# in main.rs via `human_panic::setup_panic!()` before any other code.
human-panic.workspace = true

# === Hot-path JSON decoders (opt-in via `fast-json`) ===
#
# `serde_json` is the always-on baseline. The two SIMD libraries below
# are wired conditionally per architecture — sonic-rs is x86_64 only
# (SSE4.2/AVX2), simd-json carries an aarch64 NEON path. Default
# builds stay on `serde_json::from_slice`; opt-in users flip
# `--features fast-json` to pick the platform-appropriate decoder for
# the Bun↔host IPC frame parse loop.
[target.'cfg(target_arch = "x86_64")'.dependencies]
sonic-rs = { workspace = true, optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
simd-json = { workspace = true, optional = true }

[features]
default = ["preset"]
# The shipped `full` preset: every OS API. Plugins are NOT bundled — apps
# pick exactly what they need via the CLI custom-build pipeline.
# `deep-link` is listed alongside `api-all` because it is a *local* feature
# mirror of `tynd-host/api-deep-link` (see the `deep-link` entry below for
# the rationale), not a separate API surface.
preset  = ["tynd-host/api-all", "deep-link"]

# Local mirror of `tynd-host/api-deep-link`. Calling
# `tynd_host::os::deep_link::init()` early in `run()` (before the event
# loop) is a `cfg(feature = ...)`-gated block that needs a feature on
# *this* crate; this gate is the bridge. Custom builds that drop deep-
# link from `tynd-host/api-*` should also drop it here.
deep-link = ["tynd-host/api-deep-link"]

# Opt-in SIMD JSON decoder for the Bun↔host stdout IPC frame loop.
# Off by default — sonic-rs requires SSE4.2/AVX2 (x86_64) and simd-json
# carries its own runtime feature detection. Apps that ship to a known
# CPU baseline can flip this on for 3-5× decode throughput on bursty
# IPC bursts (large yield streams, multi-MB return values). The code
# in `bun.rs` falls back to `serde_json::from_slice` when this feature
# is off OR the target arch isn't covered.
fast-json = [ "dep:sonic-rs", "dep:simd-json" ]
