[package]
name                    = "tynd-full"
description             = "Tynd runtime (full) — Bun subprocess backend + embedded launcher"
publish                 = false
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
repository.workspace    = true
homepage.workspace      = true
documentation.workspace = true
authors.workspace       = true
keywords.workspace      = true
categories.workspace    = true
readme.workspace        = true

[lib]
name = "tynd_full"
path = "src/lib.rs"

[[bin]]
name = "tynd-full"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Host is wired with `default-features = false` so `tynd-full` can flip the
# preset (all APIs + bundled plugins) on via its own `default = ["preset"]`
# feature, or be built as a slim custom variant via
# `cargo build -p tynd-full --no-default-features --features "tynd-host/api-fs"`
# the way the CLI does for `runtime: "full-custom"`.
tynd-host            = { path = "../host-rs", default-features = false }
serde.workspace      = true
serde_json.workspace = true
mimalloc.workspace   = true
zstd.workspace       = true
dirs.workspace       = true
crossbeam-channel.workspace = true
# Pretty-prints panics for the end user (markdown crash report path,
# friendly message instead of `thread 'main' panicked at ...`). Setup
# in main.rs via `human_panic::setup_panic!()` before any other code.
human-panic.workspace = true

# Every official plugin, pulled as an optional path dep. The `bundled-plugins`
# feature flips them all on so the preset binary ships with every plugin
# linked and auto-registered — matches the pre-extraction "everything
# included" UX. Custom builds skip this feature entirely.
tynd_plugin_sql               = { path = "../../../plugins/sql/native", optional = true }
tynd_plugin_terminal          = { path = "../../../plugins/terminal/native", optional = true }
tynd_plugin_clipboard_history = { path = "../../../plugins/clipboard-history/native", optional = true }

[features]
default = ["preset"]
# The shipped `full` preset: every OS API + every official plugin.
preset  = ["tynd-host/api-all", "bundled-plugins", "deep-link"]

# Link every official plugin and auto-register them in `run()`. Turning
# this off (via `--no-default-features`) is how the CLI trims the binary
# for `runtime: "full-custom"`.
bundled-plugins = [
    "dep:tynd_plugin_sql",
    "dep:tynd_plugin_terminal",
    "dep:tynd_plugin_clipboard_history",
]

# Local mirror of `tynd-host/api-deep-link`. Calling
# `tynd_host::os::deep_link::init()` early in `run()` (before the event
# loop) is a `cfg(feature = ...)`-gated block that needs a feature on
# *this* crate; this gate is the bridge. Custom builds that drop deep-
# link from `tynd-host/api-*` should also drop it here.
deep-link = ["tynd-host/api-deep-link"]
